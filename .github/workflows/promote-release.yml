name: Promote release

# #79. Since the PO ruling "approve 1 2" (2026-10-03) a green build of main
# publishes the full release itself, marked Latest, and clears the beta; this
# workflow is no longer a step in shipping. It remains, on dispatch, to
# retitle a release (e.g. "1.0 — Match day 4") or to re-point Latest at an
# earlier build, because a Claude Code session cannot push tags or edit
# releases through the proxy:
#
#   1. makes the named main build a full release, marked Latest, with the
#      given title; the asset and notes are untouched;
#   2. deletes the `beta` prerelease and its tag, if present.
#
# Dispatch only (AC-P4). Never on push or pull request.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The main build to promote, e.g. v2026.10.03-build.64'
        required: true
        type: string
      title:
        description: 'The release title, e.g. "1.0 — Match day 4"'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote a main build to a full release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
    steps:
      - name: Check the build exists and carries an APK
        run: |
          set -uo pipefail
          why() { echo "WHY THIS JOB FAILED: $*"; exit 1; }
          case "$TAG" in
            v*-build.*) ;;
            *) why "'$TAG' is not a main build tag (expected v<date>-build.<n>)" ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets \
            > /tmp/release.json 2>/tmp/err.txt || why "no release with tag '$TAG': $(cat /tmp/err.txt)"
          cat /tmp/release.json
          APKS="$(jq '[.assets[].name | select(endswith(".apk"))] | length' /tmp/release.json)"
          [ "$APKS" -ge 1 ] || why "release '$TAG' has no .apk asset; refusing to promote it"
          echo "found $APKS apk asset(s) on $TAG"

      - name: Promote it
        run: |
          set -uo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest --title "$TITLE" 2>/tmp/err.txt \
            || { echo "WHY THIS JOB FAILED: gh release edit refused:"; cat /tmp/err.txt; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isPrerelease,url \
            --jq '"promoted: \(.name)  prerelease=\(.isPrerelease)  \(.url)"'

      - name: Remove the stale beta prerelease, if any
        run: |
          set -uo pipefail
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete beta --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "beta release and tag removed"
          else
            echo "no beta release; nothing to remove"
          fi

      - name: Summary
        run: |
          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "### Promoted \`$TAG\`"
            echo
            echo "**[$TITLE]($URL)**: full release, marked Latest."
          } >> "$GITHUB_STEP_SUMMARY"
