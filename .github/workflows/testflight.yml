name: TestFlight

# #108 A: the release build of Heart FC Coach, signed and uploaded to
# TestFlight. Rob's approval gates every run: the job runs in the `app-store`
# environment, whose required reviewer is Rob, and only that environment holds
# the four secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID).
#
# A2: no pull_request trigger, ever. Only a push to main that changes
# app.json (the version bump that marks a store release, PO "approve
# testflight-on-bump", 2026-10-08) queues a run, which waits for Rob; a newer
# one cancels a waiting one. Every other merge costs no Mac time and no click.
# Apple refuses a build number at or below one it holds for the same version,
# so an upload without a bump would fail anyway. By hand:
#
#   gh workflow run testflight.yml --ref main                  # sign and upload
#   gh workflow run testflight.yml --ref main -f dry_run=true  # sign, export, stop
#   gh workflow run testflight.yml --ref main -f what_to_test_for=SHA  # #182: rewrite
#       the What to Test of the build made from SHA; builds and uploads nothing
#   gh workflow run testflight.yml --ref main -f app_store_for=SHA     # #226: only the
#       App Store steps below, for the build made from SHA (already uploaded):
#       the way to finish after a refusal, with no new build and no bump
#   gh workflow run testflight.yml --ref main -f app_store_for=SHA -f dry_run=true
#       # reads every version, its state and the build, prints the plan, changes nothing
#
# #226 (PO "approve 226"): after the upload and What to Test, the same run
# creates or reuses the App Store version for app.json's version, attaches
# this build, sets "Automatically release this version" (AFTER_APPROVAL),
# sends the listing text, sets What's New from store/app-store/en-GB/whats_new.txt
# puts the approved screenshots (store/app-store/screenshots/, exactly the
# shots screenshot_captions.txt names) on the version, uploading only a set
# that differs, and submits it for review (asc_api.py release), which refuses
# before any write if those shots are missing. Rob's approvals are the same
# two: the merge, and this environment. Apple's approval then releases it.
# Every step checks before it acts, so a re-run finishes what an earlier run
# started. Anything unexpected (another editable version, a rejected one, a
# build not processed or missing compliance, an empty field) turns the job red
# with WHY THIS JOB FAILED and leaves the TestFlight upload standing. It never
# cancels a submission, deletes a version or releases one by hand.
#
# The unsigned healthy case (A7) is ios.yml's device-build job, on every PR.
# No certificate or provisioning profile is held anywhere (A1): Apple's
# automatic signing makes them, with a cloud-managed distribution
# certificate (ios-archive.sh).

# #226 Q5, Rob's call: 'on' releases each version through Apple's 7-day phased
# release (automatic updates reach phones over a week; Rob can pause or finish
# it in App Store Connect); 'off' releases it to everyone on approval.
env:
  PHASED_RELEASE: 'off'

on:
  push:
    branches: [main]
    paths: [app.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sign and export the .ipa, run every check, and upload nothing"
        type: boolean
        default: false
      what_to_test_for:
        description: "Only rewrite What to Test for the build made from this main commit (no build, no upload)"
        type: string
        default: ""
      app_store_for:
        description: "Only the App Store steps (version, build, What's New, submit) for the build made from this main commit (no build, no upload)"
        type: string
        default: ""

# Every dry run (the full one, or the plan alone with app_store_for) writes
# nothing, so it has its own group: it never cancels a real run, waiting for
# Rob's approval or part-way through (#226 QA R4). A newer dry run cancels an
# older one; a newer real run cancels an older real run, which a re-run (or
# app_store_for) finishes.
concurrency:
  group: testflight-${{ inputs.dry_run && 'dry' || 'write' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # #160: one build number per commit. The GitHub release built from this
  # commit (android-apk.yml) names it, v<version>-build.N, and N is also that
  # APK's versionCode, so TestFlight, the releases page and Android show the
  # same number for the same code. Waits for that release, bounded; on Linux,
  # because waiting on macOS is billed at the Mac rate. Also writes TestFlight's
  # "What to Test" from the same release note (AC3).
  # ---------------------------------------------------------------------------
  number:
    name: Find this commit's build number
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      build: ${{ steps.find.outputs.BUILD }}
      tag: ${{ steps.find.outputs.TAG }}
      version: ${{ steps.sha.outputs.VERSION }}
    env:
      GH_TOKEN: ${{ github.token }}
      WHAT_TO_TEST_FOR: ${{ inputs.what_to_test_for }}
      APP_STORE_FOR: ${{ inputs.app_store_for }}
    steps:
      # #182: What to Test lists the merges since the previous version, which
      # it finds in app.json's history, so the whole history is needed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Self-test the notes script
        run: python3 .github/scripts/testflight_notes.py --self-test

      # A notes-only run (#182) or an App Store-only run (#226) names an
      # earlier commit of main; otherwise this one. The full SHA, because the
      # release lookup compares it whole.
      - name: Which commit
        id: sha
        run: |
          set -euo pipefail
          if [ -n "$WHAT_TO_TEST_FOR" ] && [ -n "$APP_STORE_FOR" ]; then
            echo "WHY THIS JOB FAILED: what_to_test_for and app_store_for are separate runs; give one."
            exit 1
          fi
          FOR="${WHAT_TO_TEST_FOR:-$APP_STORE_FOR}"
          if [ -n "$FOR" ]; then
            SHA="$(git rev-parse --verify "${FOR}^{commit}" 2>/dev/null)" \
              || { echo "WHY THIS JOB FAILED: '$FOR' is not a commit here"; exit 1; }
            git merge-base --is-ancestor "$SHA" "$GITHUB_SHA" \
              || { echo "WHY THIS JOB FAILED: $SHA is not on main"; exit 1; }
          else
            SHA="$GITHUB_SHA"
          fi
          VERSION="$(git show "$SHA:app.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["expo"]["version"])')"
          echo "commit $SHA, version $VERSION"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for this commit's release
        id: find
        run: |
          set -uo pipefail
          for i in $(seq 1 80); do
            if python3 .github/scripts/testflight_notes.py number "$SHA" > /tmp/found.txt; then
              cat /tmp/found.txt | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $i: no release for ${SHA:0:7} yet; waiting 30s"
            sleep 30
          done
          echo "=============================================================="
          echo "WHY THIS JOB FAILED: no release for ${SHA:0:7} appeared within 40 minutes (#160 AC1)."
          echo "android-apk.yml publishes it on a green build of main; check that run."
          echo "=============================================================="
          exit 1

      - name: Write What to Test from the release note
        run: python3 .github/scripts/testflight_notes.py notes "$SHA" "${{ steps.find.outputs.BUILD }}" what-to-test.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: what-to-test
          path: what-to-test.txt
          if-no-files-found: error
          retention-days: 14

  # #182: a notes-only run rewrites one build's What to Test, nothing else.
  # In app-store, like every App Store Connect write, so Rob approves it.
  what-to-test:
    name: Rewrite What to Test
    needs: number
    if: inputs.what_to_test_for != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store
    env:
      VERSION: ${{ needs.number.outputs.version }}
      IOS_BUILD_NUMBER: ${{ needs.number.outputs.build }}
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "WHY THIS JOB FAILED: App Store Connect is written from main only; this run is on $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: what-to-test

      - name: Write and check the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          .github/scripts/asc-key.sh "$RUNNER_TEMP/asc-key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"

      - name: Set What to Test and read it back
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "Heart FC Coach $VERSION (build $IOS_BUILD_NUMBER)"
          echo "--- What to Test ---"; cat what-to-test.txt; echo; echo "---"
          # asc_api.py never fails an upload over the notes; here the notes are the job.
          python3 .github/scripts/asc_api.py what-to-test com.vanstoner.coachingapp "$VERSION" "$IOS_BUILD_NUMBER" what-to-test.txt 1 | tee /tmp/wtt.log
          grep -q "set and read back" /tmp/wtt.log \
            || { echo "WHY THIS JOB FAILED: What to Test for $VERSION ($IOS_BUILD_NUMBER) was not set and read back"; exit 1; }

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"

  upload:
    name: Sign and upload to TestFlight, then submit for review
    needs: number
    if: inputs.what_to_test_for == '' && inputs.app_store_for == ''
    runs-on: macos-26
    timeout-minutes: 90
    environment: app-store
    env:
      # The release variant only (A1): Heart FC Coach, distribution app.
      APP_VARIANT: ''
      DISTRIBUTION: app
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # #160 AC1: the build number of this commit's GitHub release.
      IOS_BUILD_NUMBER: ${{ needs.number.outputs.build }}
      RELEASE_TAG: ${{ needs.number.outputs.tag }}
      # #226 AC3: how long the run waits for Apple to finish processing the
      # upload before the App Store steps; past it, the job fails and names it.
      PROCESSING_WAIT_MINUTES: 30
    steps:
      # A2: before anything is built or signed.
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "WHY THIS JOB FAILED: TestFlight uploads come from main only; this run is on $GITHUB_REF (#108 A2)."
            echo "For an unsigned check of a branch, see ios.yml's 'Archive for a device' job on its PR."
            exit 1
          fi
          echo "ref: $GITHUB_REF  dry run: $DRY_RUN  build number: $IOS_BUILD_NUMBER ($RELEASE_TAG)"

      # A4: a missing secret fails here and is named; a value is never printed.
      - name: Check the four secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "WHY THIS JOB FAILED: missing from the app-store environment:$missing"
            exit 1
          fi
          case "$ASC_KEY_P8" in
            *"-----BEGIN PRIVATE KEY-----"*"-----END PRIVATE KEY-----"*) ;;
            *) echo "WHY THIS JOB FAILED: ASC_KEY_P8 is not the whole .p8 file (the BEGIN and END lines are missing)"; exit 1 ;;
          esac
          echo "all four secrets are present"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Straight after checkout, before three minutes of building: the key is
      # repaired if a paste reshaped it, written to a file only this job can
      # read, and parsed. It is removed at the end whatever happens. Its value
      # is never printed, only its shape (A4). Run 37490079637 is why.
      - name: Write and check the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          .github/scripts/asc-key.sh "$RUNNER_TEMP/asc-key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Self-test the .app assertion
        run: python3 .github/scripts/check_ios_app.py --self-test

      # #226 AC23: the release decision is proved before any App Store Connect write.
      - name: Self-test the App Store client
        run: python3 .github/scripts/asc_api.py --self-test

      - name: Install dependencies
        run: npm ci

      # The version is build-label.sh's, as on Android (A6). The label is the
      # release's own tag, v<version>-build.N, as on Android (#160 AC6), so
      # the paste-into-the-releases-page rule (#52) holds on iPhone too. No
      # "(pr N)", so no Test kit (isBetaBuild).
      - name: Compute the version and the label
        run: |
          set -euo pipefail
          .github/scripts/build-label.sh >> "$GITHUB_ENV"
          VERSION="$(.github/scripts/build-label.sh | sed -n 's/^VERSION=//p')"
          case "$RELEASE_TAG" in
            "v$VERSION-build.$IOS_BUILD_NUMBER") ;;
            *) echo "WHY THIS JOB FAILED: release $RELEASE_TAG is not version $VERSION build $IOS_BUILD_NUMBER"; exit 1 ;;
          esac
          echo "BUILD_LABEL=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "label: $RELEASE_TAG"

      # #160 AC2: Apple refuses a build number it has already seen for this
      # version, after a full build. Asked first, so the run fails in seconds.
      - name: Check Apple has no build this high already
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -uo pipefail
          APPLE_MAX="$(python3 .github/scripts/asc_api.py max-build com.vanstoner.coachingapp "$VERSION")" || {
            echo "WHY THIS JOB FAILED: could not ask App Store Connect for its builds of $VERSION"; exit 1; }
          echo "Apple's highest build of $VERSION: $APPLE_MAX; this build: $IOS_BUILD_NUMBER"
          if [ "$IOS_BUILD_NUMBER" -le "$APPLE_MAX" ]; then
            echo "=============================================================="
            echo "WHY THIS JOB FAILED: Apple already has $VERSION ($APPLE_MAX); build $IOS_BUILD_NUMBER is not higher (#160 AC2)."
            echo "Raise the version in app.json (a fix is a patch: 1.0.0 -> 1.0.1), or upload a later commit."
            echo "=============================================================="
            exit 1
          fi

      - name: Write the build label and the distribution into the bundle
        run: |
          set -euo pipefail
          python3 .github/scripts/write-build-label.py "$BUILD_LABEL"
          python3 .github/scripts/write-distribution.py "$DISTRIBUTION" "$APP_VARIANT"

      - name: Generate the native iOS project
        env:
          APP_VERSION_NAME: ${{ env.VERSION }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Archive for a device, signed
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/ios-archive.sh signed build-device/App.xcarchive

      - name: Export the signed .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/ios-export.sh export build-device/App.xcarchive build-device/export

      # A8 on the SIGNED artifact, before any upload.
      - name: Assert the signed app (A8)
        run: |
          set -uo pipefail
          IPA="$(ls build-device/export/*.ipa)"
          rm -rf /tmp/ipa && mkdir /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          SIGNED_APP="$(ls -d /tmp/ipa/Payload/*.app)"
          check=0
          python3 .github/scripts/check_ios_app.py "$SIGNED_APP/Info.plist" "$APP_VARIANT" "$IOS_BUILD_NUMBER" "$VERSION" \
            > /tmp/ios-check.txt 2>&1 || check=$?
          cat /tmp/ios-check.txt
          bundle=0
          python3 .github/scripts/assert_label_in_bundle.py "$SIGNED_APP/main.jsbundle" "$BUILD_LABEL" || bundle=1
          python3 .github/scripts/write-distribution.py --assert-bundle "$SIGNED_APP/main.jsbundle" "$DISTRIBUTION" || bundle=1
          codesign --verify --deep --strict "$SIGNED_APP" || check=1
          codesign -dv "$SIGNED_APP" 2>&1 | grep -E '^(Authority|TeamIdentifier)=' | sed 's/TeamIdentifier=.*/TeamIdentifier=(present)/' || true
          if [ "$check" != 0 ] || [ "$bundle" != 0 ]; then
            echo "=============================================================="
            echo "WHY THIS JOB FAILED"
            echo "=============================================================="
            grep -E '^ASSERTION FAILED' /tmp/ios-check.txt || true
            [ "$bundle" = 0 ] || echo "the bundle lacks the label '$BUILD_LABEL' or is not only distribution:$DISTRIBUTION"
            echo "or the signature did not verify (codesign --verify)"
            echo "=============================================================="
            exit 1
          fi
          echo "signed .ipa: Heart FC Coach $VERSION ($IOS_BUILD_NUMBER), signing path $SIGNING_PATH"

      - name: Upload to TestFlight
        id: upload
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/ios-export.sh upload build-device/App.xcarchive build-device/upload

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.DRY_RUN != 'true'
        with:
          name: what-to-test

      # #160 AC3: never fails the job; the upload has already happened.
      - name: Set What to Test from the release note
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "--- What to Test ---"; cat what-to-test.txt; echo; echo "---"
          python3 .github/scripts/asc_api.py what-to-test com.vanstoner.coachingapp "$VERSION" "$IOS_BUILD_NUMBER" what-to-test.txt 25

      # #226: after the upload and What to Test. In a dry run (nothing
      # uploaded) it reads everything, prints the plan and writes nothing.
      - name: "App Store: version, build, release after approval, What's New, submit"
        id: appstore
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -uo pipefail
          DRY=""
          [ "$DRY_RUN" = true ] && DRY="--dry-run"
          python3 .github/scripts/asc_api.py release com.vanstoner.coachingapp "$VERSION" "$IOS_BUILD_NUMBER" \
            store/app-store/en-GB/whats_new.txt --listing store/app-store/en-GB --phased "$PHASED_RELEASE" \
            --screenshots store/app-store/screenshots --captions store/app-store/en-GB/screenshot_captions.txt \
            --wait-minutes "$PROCESSING_WAIT_MINUTES" --summary "$RUNNER_TEMP/app-store.txt" $DRY

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### TestFlight and the App Store"
            echo "Heart FC Coach ${VERSION:-?} (build $IOS_BUILD_NUMBER), signing path ${SIGNING_PATH:-not reached}."
            if [ "$DRY_RUN" = true ]; then
              echo "**Dry run: nothing was uploaded.**"
              cat "$RUNNER_TEMP/app-store.txt" 2>/dev/null || echo "App Store plan: not reached."
            elif [ "${{ steps.upload.outcome }}" != success ]; then
              echo "Not uploaded: see WHY THIS JOB FAILED above."
            elif [ "${{ steps.appstore.outcome }}" = success ]; then
              cat "$RUNNER_TEMP/app-store.txt"
            else
              cat "$RUNNER_TEMP/app-store.txt" 2>/dev/null \
                || echo "Uploaded to TestFlight (build $IOS_BUILD_NUMBER). Not submitted for review: see WHY THIS JOB FAILED."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"

  # #226 AC13: the App Store steps alone, for a build already uploaded: the
  # way to finish after a refusal without a new build or a version bump. In
  # app-store, like every App Store Connect write, so Rob approves it.
  app-store-only:
    name: App Store steps only (no build)
    needs: number
    if: inputs.app_store_for != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: app-store
    env:
      VERSION: ${{ needs.number.outputs.version }}
      IOS_BUILD_NUMBER: ${{ needs.number.outputs.build }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      PROCESSING_WAIT_MINUTES: 30
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "WHY THIS JOB FAILED: App Store Connect is read and written from main only; this run is on $GITHUB_REF."
            exit 1
          fi

      # main's scripts and main's What's New, which may have been corrected
      # since; but only while main is still on the version being submitted.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Main is still on this version
        run: |
          HEAD_VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          if [ "$HEAD_VERSION" != "$VERSION" ]; then
            echo "WHY THIS JOB FAILED: main is on $HEAD_VERSION, so its What's New is not $VERSION's. Submit $HEAD_VERSION instead."
            exit 1
          fi
          echo "main is on $VERSION; build $IOS_BUILD_NUMBER; dry run: $DRY_RUN; phased release: $PHASED_RELEASE"

      - name: Self-test the App Store client
        run: |
          python3 .github/scripts/asc_api.py --self-test
          python3 .github/scripts/check_listing.py store/app-store/en-GB
          python3 .github/scripts/check_store_media.py set store/app-store/screenshots store/app-store/en-GB/screenshot_captions.txt

      - name: Write and check the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          .github/scripts/asc-key.sh "$RUNNER_TEMP/asc-key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"

      - name: "App Store: version, build, release after approval, What's New, submit"
        id: appstore
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -uo pipefail
          DRY=""
          [ "$DRY_RUN" = true ] && DRY="--dry-run"
          python3 .github/scripts/asc_api.py release com.vanstoner.coachingapp "$VERSION" "$IOS_BUILD_NUMBER" \
            store/app-store/en-GB/whats_new.txt --listing store/app-store/en-GB --phased "$PHASED_RELEASE" \
            --screenshots store/app-store/screenshots --captions store/app-store/en-GB/screenshot_captions.txt \
            --wait-minutes "$PROCESSING_WAIT_MINUTES" --summary "$RUNNER_TEMP/app-store.txt" $DRY

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### App Store"
            cat "$RUNNER_TEMP/app-store.txt" 2>/dev/null || echo "Not reached: see WHY THIS JOB FAILED above."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"
