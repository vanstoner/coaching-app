name: Website

# The marketing site at https://vanstoner.github.io/coaching-app/ (#108, PO
# "approve site"): site/ plus the app icon, with privacy.html made from
# PRIVACY.md (and coaches.html from COACHES.md) by GitHub's own Markdown
# renderer, so there is one privacy policy and one coaches' guide; guide.html
# is GUIDE.md, the how-to guide, with the App Store shots served beside it. A PR builds and checks it (the healthy case, before merge); a push
# to main publishes it. The App Store's support and privacy links point here.
# Needs Settings › Pages › Source: GitHub Actions, once.
#
# releases.html (#240) reads status.json and flow.json, which this workflow
# gathers from GitHub and Apple's public lookup on every build: after each
# Android APK, TestFlight, Google Play or App Store listing run on main, and
# once a day while a step waits on Apple or Google (Q2). It only reads;
# nothing it does can fail or change a release (criteria 9, 10).

on:
  push:
    branches: [main]
    paths: [site/**, test-data/test-season.json, PRIVACY.md, COACHES.md, GUIDE.md, store/app-store/screenshots/iphone/**, store/play/**, assets/images/icon.png, .github/workflows/pages.yml, .github/scripts/build_site.py, .github/scripts/release_status.py, .github/scripts/build_tests_page.py]
  pull_request:
    paths: [site/**, test-data/test-season.json, PRIVACY.md, COACHES.md, GUIDE.md, store/app-store/screenshots/iphone/**, store/play/**, assets/images/icon.png, .github/workflows/pages.yml, .github/scripts/build_site.py, .github/scripts/release_status.py, .github/scripts/build_tests_page.py]
  workflow_dispatch:
  workflow_run:
    workflows: [Android APK, TestFlight, Google Play, App Store listing, Tests]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 6 * * *"

# #230: a newer push to a PR cancels its older check (nothing is written on
# a PR). On main, never: `deploy` is not cancelled mid-publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only: the release tracker reads runs, issues and PRs (#240 criterion 9).
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      publish: ${{ steps.need.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Q2 on #240: the daily run refreshes only while a step waits on Apple
      # or Google; any other event always builds.
      - name: Is the daily refresh needed?
        id: need
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if curl -fsS https://vanstoner.github.io/coaching-app/status.json 2>/dev/null | grep -qE '"state": "(apple|google)"'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "a step is waiting on Apple or Google: refreshing"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "nothing waits on Apple or Google: no refresh today"
          fi

      - name: Self-test the release tracker's data and privacy checks
        run: python3 .github/scripts/release_status.py --self-test

      - name: Self-test the site check
        run: python3 .github/scripts/build_site.py --self-test

      - name: Render PRIVACY.md, COACHES.md and GUIDE.md, and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST markdown -f mode=gfm -f context="$GITHUB_REPOSITORY" -F text=@PRIVACY.md > /tmp/privacy.html
          test -s /tmp/privacy.html || { echo "WHY THIS JOB FAILED: GitHub rendered PRIVACY.md as nothing"; exit 1; }
          gh api -X POST markdown -f mode=gfm -f context="$GITHUB_REPOSITORY" -F text=@COACHES.md > /tmp/coaches.html
          test -s /tmp/coaches.html || { echo "WHY THIS JOB FAILED: GitHub rendered COACHES.md as nothing"; exit 1; }
          gh api -X POST markdown -f mode=gfm -f context="$GITHUB_REPOSITORY" -F text=@GUIDE.md > /tmp/guide.html
          test -s /tmp/guide.html || { echo "WHY THIS JOB FAILED: GitHub rendered GUIDE.md as nothing"; exit 1; }
          python3 .github/scripts/build_site.py /tmp/privacy.html /tmp/coaches.html /tmp/guide.html _site

      # #240 criteria 7-10: gather the tracker's data. A failure never fails
      # the site: the last published data is kept and the page shows its age.
      - name: Gather the release tracker's data (reads only)
        id: gather
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          python3 .github/scripts/release_status.py gather _site --previous https://vanstoner.github.io/coaching-app
          echo "gathered in $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the last published data if gathering failed
        if: steps.gather.outcome != 'success'
        run: |
          echo "Release tracker data could not be gathered; keeping the last published files (criterion 10)." | tee -a "$GITHUB_STEP_SUMMARY"
          for f in status.json flow.json; do
            curl -fsS "https://vanstoner.github.io/coaching-app/$f" -o "_site/$f" || rm -f "_site/$f"
          done

      # Criterion 11: nothing personal and nothing secret is ever published.
      - name: Check the tracker's data holds no personal data or secrets
        run: |
          files=$(ls _site/status.json _site/flow.json 2>/dev/null || true)
          [ -z "$files" ] && { echo "no tracker data to check"; exit 0; }
          python3 .github/scripts/release_status.py check $files || {
            echo "WHY THIS JOB FAILED: the release tracker's data failed the privacy check (PRIVACY PROBLEM lines above)"; exit 1; }

      # #287: the Tests page, from the latest Tests run on main or a manual run
      # (never a pull request's), and the latest emulator check on main. Reads
      # only. If gathering fails the last published page stays (the committed
      # placeholder if there is none); a red run is published red (criterion 8).
      - name: Self-test the Tests page
        run: python3 .github/scripts/build_tests_page.py --self-test

      - name: Gather the Tests page (reads only)
        id: tests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          W=$(mktemp -d)
          artifact() { # run id, artifact name, zip path: the newest artifact of that name
            local id
            id=$(gh api "repos/$REPO/actions/runs/$1/artifacts" --jq "[.artifacts[] | select(.name == \"$2\" and (.expired | not))] | sort_by(.created_at) | last | .id // empty")
            [[ "$id" =~ ^[0-9]+$ ]] && gh api "repos/$REPO/actions/artifacts/$id/zip" > "$3"
          }
          # The emulator check: the newest finished Android APK run on main whose
          # emulator job ran (a docs-only push skips it).
          emu_args=()
          for id in $(gh api "repos/$REPO/actions/workflows/android-apk.yml/runs?branch=main&event=push&status=completed&per_page=15" --jq '.workflow_runs[].id' 2>/dev/null || true); do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            conclusion=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "Prove the app renders on an emulator")] | last | .conclusion // ""' 2>/dev/null || true)
            case "$conclusion" in success|failure) ;; *) continue ;; esac
            info=$(gh api "repos/$REPO/actions/runs/$id" --jq '{sha: .head_sha, run_url: .html_url, ran_at: .updated_at}')
            shot=null
            if artifact "$id" coaching-app-smoke-evidence "$W/emu.zip" && unzip -o -q -j "$W/emu.zip" screenshot.png -d "$W"; then
              cp "$W/screenshot.png" _site/tests-emulator.png; shot='"tests-emulator.png"'
            fi
            jq -n --argjson e "$info" --arg c "$conclusion" --argjson s "$shot" '$e + {conclusion: $c, screenshot: $s}' > "$W/emulator.json"
            emu_args=(--emulator "$W/emulator.json")
            break
          done
          # The tests: the newest finished Tests run that was not a pull request's.
          # Before tests.yml is on main, GitHub does not know it (404): no run yet.
          run=$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?status=completed&per_page=30" --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty' || true)
          [[ "$run" =~ ^[0-9]+$ ]] || run=""
          if [ -n "$run" ] && artifact "$run" test-report "$W/tr.zip" && unzip -o -q "$W/tr.zip" -d "$W/tr" && [ -s "$W/tr/vitest.json" ]; then
            python3 .github/scripts/build_tests_page.py "$W/tr/vitest.json" "$W/tr/meta.json" _site/tests.html "${emu_args[@]}"
            echo "Tests page from run $run" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 .github/scripts/build_tests_page.py --none _site/tests.html "${emu_args[@]}"
            echo "No Tests run to show yet: the page says so" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the last published Tests page if gathering failed
        if: steps.tests.outcome != 'success'
        run: |
          echo "The Tests page could not be gathered; keeping the last published one." | tee -a "$GITHUB_STEP_SUMMARY"
          # The published page if there is one; else the committed placeholder build_site.py copied stays.
          if curl -fsS https://vanstoner.github.io/coaching-app/tests.html -o /tmp/tests.html && [ -s /tmp/tests.html ]; then
            cp /tmp/tests.html _site/tests.html
            curl -fsS https://vanstoner.github.io/coaching-app/tests-emulator.png -o _site/tests-emulator.png || rm -f _site/tests-emulator.png
          fi
          test -s _site/tests.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
