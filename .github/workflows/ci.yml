name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch; the latest push is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Bundle, commit trailers and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The trailer check walks base..head, so it needs the history, not
          # just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # `npm ci` requires the lockfile and installs it exactly as committed,
      # which is what makes this run reproducible rather than indicative.
      - name: Install dependencies
        run: npm ci

      # Unit tests, typecheck, lint and coverage moved to the `checks` job in
      # android-apk.yml (#99 AC6): the release job there must `need` them, and
      # `needs` cannot reach across workflows. They still run on every PR.

      # Metro resolves differently from tsc and vitest. It does NOT map a `.js`
      # import specifier onto a `.ts` file, so `import '../types/index.js'`
      # typechecks, tests green, and then fails inside Gradle's
      # `createBundleReleaseJsAndAssets` four and a half minutes into an Android
      # build. That happened on PR #51 the moment App.tsx first imported from
      # src/ — until then Metro never saw those modules.
      #
      # Bundling here catches it in seconds, in the fast job, before any
      # emulator or Gradle time is spent. Run `npm run bundle:check` before
      # pushing anything that changes an import.
      - name: Bundle with Metro
        run: npm run bundle:check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # OMP-004 D5 (#47): every commit says which ISSUE it serves.
      #
      # The trailing `(#NN)` convention means the PR number on some commits and
      # the issue number on others, so `git log --grep` cannot answer "what
      # went into REQ-04?". Trailers cannot be retrofitted, which is why this
      # is enforced now rather than when it is convenient.
      #
      # The script's own self-test runs FIRST, against the healthy cases as
      # well as the failing ones. Five of six CI failures on this project were
      # assertions rejecting a correct artifact; a gate nobody has dry-run is
      # not yet a gate.
      - name: Prove the trailer check gates before trusting it
        run: python3 .github/scripts/check_refs_trailer.py --self-test

      # #79: the release job's read-back gate only runs on main, after merge,
      # so its self-test runs here, on every PR, before it is ever trusted.
      - name: Prove the release check gates before trusting it
        run: python3 .github/scripts/check_release.py --self-test

      # #128: whether a merge's note may replace the current beta. Runs only
      # on main, after merge, so its self-test runs here, healthy cases first.
      - name: Prove the beta-replacement decision before trusting it
        run: python3 .github/scripts/beta_decision.py --self-test

      # #128: the release and beta pages' PR summary. The release path only
      # runs after merge, so its self-test (healthy cases first, then every
      # degraded lookup) runs here on every PR.
      - name: Prove the release-notes summary before trusting it
        run: python3 .github/scripts/release_notes.py --self-test

      # #112: the APK's allowBackup gate runs in the Android job; its
      # self-test also runs here, on every PR, healthy cases first.
      - name: Prove the allowBackup check gates before trusting it
        run: python3 .github/scripts/check_backup.py --self-test

      # #99 AC6: a red `checks` job must stop the release AND the beta. The
      # release path only runs after merge, so the wiring that guarantees it
      # is checked here, on every PR — self-test first, healthy case included.
      - name: A red test run stops the release and the beta
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_release_gating.py --self-test
          python3 .github/scripts/check_release_gating.py .github/workflows/android-apk.yml

      - name: Every commit references its issue
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          # `github.event.before` is all-zeroes on a branch's first push, and
          # naming a commit that does not exist would fail the job on correct
          # software. Fall back to the first parent.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || echo "")"
          fi
          if [ -z "$BASE" ]; then
            echo "no base commit to compare against — nothing to check"
            exit 0
          fi
          echo "checking $BASE..$HEAD"
          python3 .github/scripts/check_refs_trailer.py "$BASE" "$HEAD"

      # Exits non-zero on failure, so it gates like the other two steps.
      - name: Validate docs
        run: python3 docs/process/validate-docs.py
