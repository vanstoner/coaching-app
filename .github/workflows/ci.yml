name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch; the latest push is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Test, typecheck and validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` requires the lockfile and installs it exactly as committed,
      # which is what makes this run reproducible rather than indicative.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Typecheck
        run: npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exits non-zero on failure, so it gates like the other two steps.
      - name: Validate docs
        run: python3 docs/process/validate-docs.py
