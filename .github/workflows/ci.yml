name: CI

on:
  # #230: ready_for_review and labeled too, so the screenshot-set check
  # below runs when a draft is marked ready or labelled `ci:full`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

# Cancel superseded runs on the same branch; the latest push is the one that
# matters. Nothing here writes, so cancelling a whole run is safe (#230).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Bundle, commit trailers and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The trailer check walks base..head, so it needs the history, not
          # just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # `npm ci` requires the lockfile and installs it exactly as committed,
      # which is what makes this run reproducible rather than indicative.
      - name: Install dependencies
        run: npm ci

      # Unit tests, typecheck, lint and coverage moved to the `checks` job in
      # android-apk.yml (#99 AC6): the release job there must `need` them, and
      # `needs` cannot reach across workflows. They still run on every PR.

      # Metro resolves differently from tsc and vitest. It does NOT map a `.js`
      # import specifier onto a `.ts` file, so `import '../types/index.js'`
      # typechecks, tests green, and then fails inside Gradle's
      # `createBundleReleaseJsAndAssets` four and a half minutes into an Android
      # build. That happened on PR #51 the moment App.tsx first imported from
      # src/ — until then Metro never saw those modules.
      #
      # Bundling here catches it in seconds, in the fast job, before any
      # emulator or Gradle time is spent. Run `npm run bundle:check` before
      # pushing anything that changes an import.
      - name: Bundle with Metro
        run: npm run bundle:check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # OMP-004 D5 (#47): every commit says which ISSUE it serves.
      #
      # The trailing `(#NN)` convention means the PR number on some commits and
      # the issue number on others, so `git log --grep` cannot answer "what
      # went into REQ-04?". Trailers cannot be retrofitted, which is why this
      # is enforced now rather than when it is convenient.
      #
      # The script's own self-test runs FIRST, against the healthy cases as
      # well as the failing ones. Five of six CI failures on this project were
      # assertions rejecting a correct artifact; a gate nobody has dry-run is
      # not yet a gate.
      - name: Prove the trailer check gates before trusting it
        run: python3 .github/scripts/check_refs_trailer.py --self-test

      # #79: the release job's read-back gate only runs on main, after merge,
      # so its self-test runs here, on every PR, before it is ever trusted.
      - name: Prove the release check gates before trusting it
        run: python3 .github/scripts/check_release.py --self-test

      # #128: whether a merge's note may replace the current beta. Runs only
      # on main, after merge, so its self-test runs here, healthy cases first.
      - name: Prove the beta-replacement decision before trusting it
        run: python3 .github/scripts/beta_decision.py --self-test

      # #128: the release and beta pages' PR summary. The release path only
      # runs after merge, so its self-test (healthy cases first, then every
      # degraded lookup) runs here on every PR.
      - name: Prove the release-notes summary before trusting it
        run: python3 .github/scripts/release_notes.py --self-test

      # #112: the APK's allowBackup gate runs in the Android job; its
      # self-test also runs here, on every PR, healthy cases first.
      - name: Prove the allowBackup check gates before trusting it
        run: python3 .github/scripts/check_backup.py --self-test

      # #108 A4: testflight.yml repairs and validates the API key with this
      # script, in the app-store environment, after merge. Its self-test runs
      # here on every PR: a healthy key first, then each broken paste.
      - name: Self-test the API key repair
        run: .github/scripts/asc-key.sh --self-test

      # #160: testflight.yml takes its build number from this commit's release,
      # asks App Store Connect for the highest it already has, and sets What to
      # Test from the release note. Both scripts self-test here on every PR.
      - name: Self-test the TestFlight numbering and notes
        run: |
          python3 .github/scripts/testflight_notes.py --self-test
          python3 .github/scripts/asc_api.py --self-test

      # #108 D2: the App Store listing files stay within Apple's limits and
      # claim nothing v1 lacks. Self-test first, then the real files.
      - name: Check the App Store listing
        run: |
          python3 .github/scripts/check_listing.py --self-test
          python3 .github/scripts/check_listing.py store/app-store/en-GB

      # #108 E: the screenshot and preview checks run on a Mac in
      # store-media.yml; their self-test runs here on every PR, healthy first.
      # #226: so does the compositor's (Pillow pinned by hash) and the
      # caption check. The committed set itself is the `store-set` job below.
      - name: Prove the App Store media checks and the compositor
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/scripts/requirements-media.txt
          python3 .github/scripts/check_store_media.py --self-test
          python3 .github/scripts/composite_shots.py --self-test
          python3 .github/scripts/composite_shots.py check-captions store/app-store/en-GB/screenshot_captions.txt

      # #230 criterion 11: what each push builds. android-apk.yml and ios.yml
      # run the same self-test in their scope jobs before deciding.
      - name: Prove the build-scope decision before trusting it
        run: python3 .github/scripts/ci_scope.py --self-test

      # #167: released data survives every update. The upgrade test runs in
      # vitest; this gate makes a version bump freeze the previous release's
      # data first, and refuses a release fixture that was edited or removed.
      - name: Every release's stored data is frozen and kept
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_release_fixture.py --self-test
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          python3 .github/scripts/check_release_fixture.py "$BASE"

      # #145: the emulator's Settings check (beta-only features) runs in the
      # Android job; its self-test also runs here, in seconds, healthy first.
      - name: Prove the beta-only check gates before trusting it
        run: python3 .github/scripts/check_beta_only.py --self-test

      # #146: the distribution writer and its bundle assertion (ADR-017 §5)
      # run in the Android and iOS jobs; the self-test also runs here, in
      # seconds, healthy cases first.
      - name: Prove the distribution writer and its bundle check before trusting them
        run: python3 .github/scripts/write-distribution.py --self-test

      # #99 AC6: a red `checks` job must stop the release AND the beta. The
      # release path only runs after merge, so the wiring that guarantees it
      # is checked here, on every PR — self-test first, healthy case included.
      - name: A red test run stops the release and the beta
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_release_gating.py --self-test
          python3 .github/scripts/check_release_gating.py .github/workflows/android-apk.yml

      - name: Every commit references its issue
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          # `github.event.before` is all-zeroes on a branch's first push, and
          # naming a commit that does not exist would fail the job on correct
          # software. Fall back to the first parent.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || echo "")"
          fi
          if [ -z "$BASE" ]; then
            echo "no base commit to compare against — nothing to check"
            exit 0
          fi
          echo "checking $BASE..$HEAD"
          python3 .github/scripts/check_refs_trailer.py "$BASE" "$HEAD"

      # Exits non-zero on failure, so it gates like the other two steps.
      - name: Validate docs
        run: python3 docs/process/validate-docs.py

  # ---------------------------------------------------------------------------
  # The committed screenshot set — #226, #230 criteria 29-30
  # ---------------------------------------------------------------------------
  #
  # The committed screenshots must be exactly the captioned set, because the
  # release run uploads them before it submits. Its own named check, so a red
  # set no longer hides whether the trailer and docs gates passed, and on a
  # draft it is skipped (not red): a set waiting on store-media.yml and Rob's
  # approval no longer fails every draft push. It runs, and blocks, when the
  # PR is ready for review or labelled `ci:full`, and on main. testflight.yml
  # and store-listing.yml still refuse a wrong set before any upload.
  store-set:
    name: App Store screenshots are the approved, captioned set
    if: >-
      github.event_name != 'pull_request' ||
      !github.event.pull_request.draft ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: The committed screenshots are the captioned set
        run: |
          set -euo pipefail
          python3 .github/scripts/check_store_media.py --self-test
          python3 .github/scripts/check_store_media.py set store/app-store/screenshots \
            store/app-store/en-GB/screenshot_captions.txt || {
            echo "WHY THIS JOB FAILED: store/app-store/screenshots/ is not the approved, captioned set."
            echo "Run store-media.yml on this branch, show Rob the shots, and commit them there."
            exit 1
          }
