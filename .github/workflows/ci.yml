name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch; the latest push is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Test, typecheck and validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` requires the lockfile and installs it exactly as committed,
      # which is what makes this run reproducible rather than indicative.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Typecheck
        run: npx tsc --noEmit

      # Metro resolves differently from tsc and vitest. It does NOT map a `.js`
      # import specifier onto a `.ts` file, so `import '../types/index.js'`
      # typechecks, tests green, and then fails inside Gradle's
      # `createBundleReleaseJsAndAssets` four and a half minutes into an Android
      # build. That happened on PR #51 the moment App.tsx first imported from
      # src/ — until then Metro never saw those modules.
      #
      # Bundling here catches it in seconds, in the fast job, before any
      # emulator or Gradle time is spent. Run `npm run bundle:check` before
      # pushing anything that changes an import.
      - name: Bundle with Metro
        run: npm run bundle:check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Exits non-zero on failure, so it gates like the other two steps.
      - name: Validate docs
        run: python3 docs/process/validate-docs.py
