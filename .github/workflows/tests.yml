name: Tests

# #287: the unit tests with their JSON report, for the website's Tests page.
# On main after every push, and whenever Rob taps Run workflow (any branch).
# A pull request that changes this workflow or the page's script runs it too,
# to prove it, and publishes nothing: the website publishes only from main.
# The Android workflow's checks job still gates releases; this one reports.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/tests.yml, .github/scripts/build_tests_page.py]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests with a report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The run's outcome is kept and reported after the report is saved, so a
      # red run still publishes its failures (criterion 8).
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=test-report/vitest.json

      - name: Describe the run for the page
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.tests.outcome }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p test-report
          python3 - <<'PY'
          import json, os, time
          json.dump({
              "sha": os.environ["GITHUB_SHA"],
              "branch": os.environ["BRANCH"],
              "ran_at": time.strftime("%a %d %b %Y, %H:%M UTC", time.gmtime()),
              "run_url": os.environ["RUN_URL"],
              "event": os.environ["EVENT"],
              "outcome": os.environ["OUTCOME"],
              "root": os.environ["GITHUB_WORKSPACE"],
          }, open("test-report/meta.json", "w"))
          PY

      - name: Self-test the Tests page, then build it from this run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 .github/scripts/build_tests_page.py --self-test
          if [ -s test-report/vitest.json ]; then
            python3 .github/scripts/build_tests_page.py test-report/vitest.json test-report/meta.json test-report/tests.html
          else
            echo "WHY: Vitest wrote no report; the page will say no report yet"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: test-report
          path: test-report
          retention-days: 30

      - name: The tests passed
        if: ${{ steps.tests.outcome != 'success' }}
        run: |
          echo "WHY THIS JOB FAILED: npx vitest run failed (outcome: ${{ steps.tests.outcome }}). The report, failures included, is in the test-report artifact and on the Tests page."
          exit 1
