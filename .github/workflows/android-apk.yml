name: Android APK

# Separate from ci.yml on purpose. ci.yml is the test gate (vitest, tsc,
# validate-docs) and is shared with the engine lane; this workflow owns the
# Android artifact end to end — building it, and proving it runs — and must
# never duplicate ci.yml's steps (AC-E1/E2/E3, issue #11).
#
# Two jobs:
#   apk    builds the debug APK and asserts what can be asserted about the file.
#   smoke  boots an emulator, installs that same APK, and proves the app
#          renders (issue #43). It consumes the `apk` job's artifact rather
#          than rebuilding, so the ~6-minute build happens once per run.

on:
  pull_request:
  push:
    branches: [main]
    # A tag cuts a release. The release job below is gated on this.
    tags: ['v*']
  # AC-A7: a rebuild needs no new commit.
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      APK: android/app/build/outputs/apk/release/app-release.apk
      # D2 (#47): versionCode is the Actions run number. app.config.js reads it.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # AC-E5: Node and JDK are pinned explicitly, Node to the same major as ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # android/ is never committed (PO ruling, #11): CI generates it, so
      # app.json stays the single source of truth for the manifest.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # Run 35265658389 failed mid-configuration with
      # "Failed to install the following SDK components: ndk;27.1.12297006",
      # after two runs on the same config had installed it silently. Doing it
      # here makes the download an explicit, retried, diagnosable step instead
      # of a transient failure inside Gradle's configuration phase.
      - name: Ensure the NDK the Gradle build asks for is installed
        run: |
          set -uo pipefail
          # expo-root-project's default for SDK 57. If Gradle ever asks for a
          # different one it names the version in its error, and this moves.
          NDK_VERSION=27.1.12297006
          echo "NDKs already on the runner:"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "ndk;$NDK_VERSION already installed — nothing to download"
            exit 0
          fi
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | sed -n '$p')"
          echo "sdkmanager: $SDKMANAGER"
          for attempt in 1 2 3; do
            echo "installing ndk;$NDK_VERSION (attempt $attempt of 3)"
            # No `yes |` pipe: under pipefail, `yes` dying of SIGPIPE when
            # sdkmanager exits reports a successful install as a failure, which
            # is what happened on run 35266513072 — the NDK unzipped to 100%
            # and the step still failed. Success is judged by the installed
            # directory, not by an exit code.
            "$SDKMANAGER" "ndk;$NDK_VERSION" < /dev/null > /tmp/sdkmanager.log 2>&1 || true
            if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
              echo "installed ndk;$NDK_VERSION"
              exit 0
            fi
            echo "--- last 20 lines of sdkmanager output ---"
            tail -n 20 /tmp/sdkmanager.log
            sleep 15
          done
          echo "could not install ndk;$NDK_VERSION after 3 attempts"
          exit 1

      # assembleRelease, NOT assembleDebug — #46. A debug APK does not embed
      # the JS bundle (verified in React Native 0.86.3's gradle plugin: the
      # bundle task is only registered for non-debuggable variants), so it
      # cannot render without a Metro dev server. Release embeds it.
      #
      # Expo's generated build.gradle signs release with the DEBUG keystore by
      # default, which is what keeps this sideloadable with no keystore
      # management. The AC-A4 assertion below proves that held.
      # #52 — the build label the app shows. Computed by the SAME script the
      # release job uses to name the release, so the string on the phone and
      # the tag on the releases page cannot disagree.
      #
      # It is WRITTEN INTO A GENERATED MODULE rather than passed as
      # EXPO_PUBLIC_BUILD_LABEL. The env-var route was tried and looked proven
      # — the literal appeared in the bytecode under `expo export` — and then
      # did nothing at all here, where Gradle produces the bundle. Run
      # 35428198347 built with the variable correctly set in this job's
      # environment and shipped an APK still saying `local dev`. A mechanism
      # proven on one path is not proven on the path that ships.
      - name: Compute the build label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/build-label.sh >> "$GITHUB_ENV"

      # Dry-run the writer against a throwaway value BEFORE trusting it, then
      # write the real one. Five of six CI failures on this project were gates
      # nobody had exercised against a healthy input.
      - name: Write the build label into the bundle, and prove it took
        run: |
          set -euo pipefail
          echo "--- refuses an empty label ---"
          if python3 .github/scripts/write-build-label.py "" 2>&1; then
            echo "writer accepted an empty label — it should not"; exit 1
          fi
          echo "--- writes the real label ---"
          python3 .github/scripts/write-build-label.py "$BUILD_LABEL"
          grep -n 'GENERATED_BUILD_LABEL =' src/app/generated-build-label.ts
          # The file must now contain the label. If it does not, fail HERE,
          # not eight minutes later after a Gradle build.
          grep -qF "$BUILD_LABEL" src/app/generated-build-label.ts \
            || { echo "the generated module does not contain the label"; exit 1; }

      - name: Build release APK with the bundle embedded
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      # Every assertion below gates the job: the build is only a deliverable if
      # the APK is structurally valid, debug-signed, and has backup disabled.
      #
      # Tool output goes to files rather than through pipes: `grep ... | head -1`
      # under `pipefail` can exit 141 on SIGPIPE and kill the step with no
      # diagnostic at all, which is exactly what happened on run 35263505469.
      # Failures accumulate so one missing assertion does not hide the rest.
      - name: Assert the APK is valid, signed and backup-disabled
        run: |
          set -uo pipefail
          fail=0
          note() { echo "ASSERTION FAILED: $*"; fail=1; }

          test -f "$APK" || { echo "no APK at $APK"; exit 1; }
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "build-tools: $BT"
          echo "apk size: $(stat -c%s "$APK") bytes"

          echo "::group::AC-A3 — structurally valid"
          unzip -l "$APK" > /tmp/apk-entries.txt
          if grep -qE ' AndroidManifest\.xml$' /tmp/apk-entries.txt; then
            echo "AndroidManifest.xml present"
          else
            note "AndroidManifest.xml missing from the APK"
          fi
          if grep -qE ' classes[0-9]*\.dex$' /tmp/apk-entries.txt; then
            echo "classes*.dex present: $(grep -cE ' classes[0-9]*\.dex$' /tmp/apk-entries.txt)"
          else
            note "no classes*.dex in the APK"
          fi
          echo "::endgroup::"

          echo "::group::AC-A5 — identity from aapt2 dump badging"
          if ! "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt 2>&1; then
            note "aapt2 dump badging exited non-zero"
          fi
          echo "--- first lines of aapt2 dump badging ---"
          sed -n '1,6p' /tmp/badging.txt
          echo "-----------------------------------------"
          APP_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" /tmp/badging.txt | sed -n 1p)"
          VERSION_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" /tmp/badging.txt | sed -n 1p)"
          # build-tools 37 prints `minSdkVersion:'24'`; older ones print `sdkVersion:'24'`.
          MIN_SDK="$(sed -n "s/^minSdkVersion:'\([^']*\)'.*/\1/p" /tmp/badging.txt | sed -n 1p)"
          if [ -z "$MIN_SDK" ]; then
            MIN_SDK="$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" /tmp/badging.txt | sed -n 1p)"
          fi
          TARGET_SDK="$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" /tmp/badging.txt | sed -n 1p)"
          echo "applicationId=$APP_ID"
          echo "versionName=$VERSION_NAME"
          echo "minSdkVersion=$MIN_SDK"
          echo "targetSdkVersion=$TARGET_SDK"
          for pair in "applicationId=$APP_ID" "versionName=$VERSION_NAME" \
                      "minSdkVersion=$MIN_SDK" "targetSdkVersion=$TARGET_SDK"; do
            case "$pair" in *=) note "could not read ${pair%=} from the APK";; esac
          done
          echo "::endgroup::"

          echo "::group::AC-A4 — debug-signed, therefore sideloadable"
          if ! "$BT/apksigner" verify --print-certs "$APK" > /tmp/apksigner.txt 2>&1; then
            note "apksigner verify failed — the APK is not properly signed"
          fi
          cat /tmp/apksigner.txt
          grep -q 'CN=Android Debug' /tmp/apksigner.txt \
            || note "signer is not the Android debug keystore"
          echo "::endgroup::"

          echo "::group::AC-F2 — android:allowBackup=false in the built APK (ADR-011)"
          if ! "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt 2>&1; then
            note "aapt2 dump xmltree failed — cannot read the built manifest"
          fi
          # build-tools 37 renders the boolean as `=false`; older ones as
          # `=(type 0x12)0x0`. Both mean false; anything else fails, including
          # the attribute being absent, which on Android means backup is ON.
          BACKUP_LINE="$(grep -E 'allowBackup' /tmp/manifest.txt | sed -n 1p)"
          echo "${BACKUP_LINE:-<allowBackup attribute absent>}"
          case "$BACKUP_LINE" in
            *'=false'|*'=(type 0x12)0x0')
              echo "allowBackup is false in the artifact that reaches the phone" ;;
            *)
              note "allowBackup is not false in the APK that would reach the phone" ;;
          esac
          echo "::endgroup::"

          echo "::group::#44 — no permission beyond the agreed set"
          # blockedPermissions in app.json strips the three we rejected. This
          # asserts against the BUILT APK, because config can be overridden by
          # a library's manifest merge and the APK is what reaches the phone.
          "$BT/aapt2" dump permissions "$APK" > /tmp/perms.txt 2>&1 || \
            note "aapt2 dump permissions failed"
          sed -n 's/^uses-permission: name=.//p' /tmp/perms.txt | sed "s/'$//" \
            > /tmp/perm-names.txt || true
          echo "permissions in the APK:"; cat /tmp/perm-names.txt
          # Two classes are allowed, and the distinction is the point:
          #
          #  - the two system permissions we agreed (INTERNET, VIBRATE);
          #  - permissions in the app's OWN namespace. Android and AndroidX
          #    mint these for internal use -- e.g.
          #    <pkg>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION, which guards
          #    dynamically-registered receivers on API 33+. They are declared
          #    and held by this app alone, grant nothing to any other app, and
          #    cannot be requested by one. They are not a capability the coach
          #    is granting away.
          #
          # Any real system permission still fails the job, which is what #44
          # is for. Self-permissions are listed explicitly so a new one is
          # visible in the log rather than silently absorbed.
          while read -r perm; do
            [ -n "$perm" ] || continue
            case "$perm" in
              android.permission.INTERNET|android.permission.VIBRATE) ;;
              com.example.coachingapp.*)
                echo "app-scoped self-permission (allowed): $perm" ;;
              *) note "unexpected permission in the APK: $perm" ;;
            esac
          done < /tmp/perm-names.txt
          echo "::endgroup::"


          echo "::group::#52 — the build label is baked into the bundle"
          # The label lives in the Hermes bytecode's string table inside the
          # embedded JS bundle. If Metro's substitution did not happen, the
          # app would quietly show 'local dev' on a release build, which is
          # precisely the confusion #52 exists to end — so it fails the build.
          BUNDLE_ENTRY="$(grep -oE 'assets/index\.android\.bundle' /tmp/apk-entries.txt | sed -n 1p)"
          if [ -z "$BUNDLE_ENTRY" ]; then
            note "no assets/index.android.bundle in the APK — nothing to label"
          else
            unzip -p "$APK" "$BUNDLE_ENTRY" > /tmp/bundle.bin
            # NOT grep: Hermes stores a string as ASCII when every character
            # fits and as UTF-16LE the moment one does not, so a byte-grep for
            # the UTF-8 form fails on a correct build the instant the label
            # contains a non-ASCII character. That false red cost two runs and
            # a wrong diagnosis. The script checks both encodings.
            python3 .github/scripts/assert_label_in_bundle.py /tmp/bundle.bin "$BUILD_LABEL" \
              || note "build label '$BUILD_LABEL' is NOT in the APK's bundle"
            # NOT asserted: the absence of the string 'local dev'. It is a
            # constant in buildLabel.ts and is therefore in every bundle,
            # labelled or not, so asserting on it rejects correct artifacts —
            # which is what five of this project's six CI failures were. The
            # presence of the exact expected label is the assertion that
            # carries information; this one only looked like it did.
          fi
          echo "::endgroup::"

          exit $fail

      # AC-A1: exactly one .apk in the artifact.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: coaching-app-apk
          path: ${{ env.APK }}
          if-no-files-found: error

  # Issue #43. Every assertion in the `apk` job above passes on an APK that
  # shows a blank white screen — that is the gap this job closes, and the
  # reason the PO waived the manual sideload check (A6) on the understanding
  # that this replaces it automatically, on every PR.
  #
  # Three assertions, in the order the PO ruled on 2026-09-18 and in
  # increasing order of strength:
  #   1. the app launches and does not crash
  #   2. the screen is not blank
  #   3. OCR finds "Example FC" on it
  #
  # What this job proves and what it does not is written out in full in the
  # header of .github/scripts/emulator-smoke.sh and in the PR that added it.
  smoke:
    name: Prove the app renders on an emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_PACKAGE: com.example.coachingapp
      SMOKE_APK: apk-under-test/app-release.apk
      # The squad name App.tsx renders. Not a real club — see CLAUDE.md,
      # Data protection. If the screen changes, this moves with it.
      # `|`-separated; every entry must be on screen. The squad name proves the
      # app drew something; "Start quarter" proves REQ-01 actually rendered —
      # the engine built a match, deriveClockView ran, and the control the
      # coach presses is on the screen. A title alone would pass on a dead app.
      SMOKE_EXPECT: Example FC|Set up the match
      SMOKE_OUT: smoke-evidence
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same major as ci.yml and the apk job above. Node is
      # needed here because a debug APK fetches its JS bundle from Metro at
      # launch; see the Metro section of emulator-smoke.sh.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # avdmanager and sdkmanager are JVM tools; the emulator action shells
      # out to both.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # tesseract-ocr Depends on tesseract-ocr-eng, so --no-install-recommends
      # still gets the English training data. Both are named anyway, and the
      # installed versions are printed into the log, so an OCR result can
      # always be traced to the engine that produced it.
      - name: Install the OCR engine
        run: |
          set -uo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
          dpkg-query -W -f='${binary:Package} ${Version}\n' tesseract-ocr tesseract-ocr-eng

      # Runs before the emulator boots, and gates. It proves the assertions
      # this job is about to rely on actually fail on a blank screen, on the
      # wrong text and on noise. A gate nobody has seen fail is not a gate.
      - name: Prove the screen assertions gate before trusting them
        run: python3 .github/scripts/test_smoke_assert.py

      # Issue #43 names this as the single unverified assumption. If it turns
      # out to be wrong, this is where the job stops — in seconds, with a
      # diagnosis, rather than after an hour of software CPU emulation.
      - name: Fail fast if this runner has no KVM
        run: |
          set -uo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is absent on this runner."
            echo "Without it the emulator falls back to full software CPU emulation:"
            echo "minutes per interaction, which is not usable in CI."
            echo "Issue #43 records this as the assumption behind the whole approach."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # The same bytes the apk job asserted on and the same bytes the PO would
      # sideload — not a rebuild.
      - name: Download the APK this run built
        uses: actions/download-artifact@v4
        with:
          name: coaching-app-apk
          path: apk-under-test

      # Pinned deliberately: API level, image target and ABI are all inputs a
      # runner default would otherwise move underneath us. api-level 34 is
      # above the app's minSdk and below nothing it needs; google_apis/x86_64
      # is the image combination with KVM acceleration on this runner.
      - name: Boot an emulator, install the APK and assert the app renders
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/scripts/emulator-smoke.sh

      # if: always() is the point. A screenshot of a crash is the most useful
      # artifact this job can produce, and it is only useful if a failing run
      # still uploads it.
      - name: Upload the screenshot and the logs behind the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coaching-app-smoke-evidence
          path: smoke-evidence/
          if-no-files-found: warn
  # ---------------------------------------------------------------------------
  # Cut the release
  # ---------------------------------------------------------------------------
  #
  # Fires on a push to `main` and on a `v*` tag. It does NOT fire on pull
  # requests: a PR builds a candidate, it does not publish one.
  #
  # Why main and not only tags. The tag-only design assumed somebody could push
  # a tag. A Claude Code session cannot: `git push` of a tag ref disconnects,
  # and `POST /git/refs` returns 403 "Write access to this GitHub API path is
  # not permitted through this proxy". The release job was therefore
  # unreachable and had never once executed. The runner's GITHUB_TOKEN is a
  # different credential and is not behind that proxy, so CI creates the tag
  # itself via `gh release create --target`.
  #
  # Why not a draft. A draft release's assets are not downloadable without an
  # authenticated session, which makes them useless on a phone. A main build
  # publishes a PRERELEASE: public, installable, clearly marked as not yet
  # signed off. Promotion to a full release stays the Product Owner's call.
  #
  # The repository is public, so a published asset is world-readable. That is
  # acceptable for this artifact and only this artifact: the APK contains no
  # player data (ADR-011 keeps all of it on the device) and the app ships with
  # a placeholder squad.
  release:
    name: Cut the release
    needs: [apk, smoke]           # never attach a build whose smoke test failed
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write             # least privilege: this job only
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the changelog needs the previous tag

      - uses: actions/download-artifact@v4
        with:
          name: coaching-app-apk
          path: release-apk

      - name: Work out the tag and verify the APK carries that version
        run: |
          set -uo pipefail
          gh --version

          # The version of record lives in app.json (D2). The tag is derived
          # from it, never the other way round.
          VERSION="$(python3 -c "import json; print(json.load(open('app.json'))['expo']['version'])")"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"

          # #52: the SAME script the apk job used to bake the on-screen label.
          # Deriving the tag twice, in two jobs, is how the label on the phone
          # and the tag on the releases page would eventually disagree — and
          # the entire value of the label is that they cannot.
          # Guarded rather than bare `eval "$(...)"`: this step runs without
          # `set -e`, so a script that exits non-zero would otherwise eval an
          # empty string and fail later with an obscure unbound-variable error
          # instead of the real reason.
          if ! LABEL_ENV="$(.github/scripts/build-label.sh)"; then
            echo "build-label.sh failed — refusing to publish"
            exit 1
          fi
          eval "$LABEL_ENV"
          echo "computed by build-label.sh: TAG=$TAG BUILD_LABEL=$BUILD_LABEL"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PRERELEASE=""
          else
            # One immutable prerelease per green build of main: the audit trail.
            PRERELEASE="--prerelease"
          fi
          echo "tag: $TAG   version: $VERSION"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

          # -print -quit rather than `| head -n 1`: a pipeline that exits 141
          # on SIGPIPE under pipefail has already cost this project three runs.
          SRC="$(find release-apk -name '*.apk' -print -quit)"
          test -n "$SRC" || { echo "no APK in the artifact"; exit 1; }

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)" || true
          if [ -n "${BT:-}" ] && [ -x "$BT/aapt2" ]; then
            "$BT/aapt2" dump badging "$SRC" > /tmp/badging.txt 2>&1 || true
            APK_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" /tmp/badging.txt | sed -n 1p)"
            echo "app.json says: $VERSION   APK says: ${APK_VERSION:-<unreadable>}"
            if [ "${APK_VERSION:-}" != "$VERSION" ]; then
              echo "versionName in the APK does not equal app.json — refusing to publish"
              exit 1
            fi
          else
            echo "aapt2 unavailable on this runner; skipping the versionName check"
          fi

          NAME="coaching-app_${VERSION}_${SHORT_SHA}.apk"
          cp "$SRC" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
          echo "ASSET=$NAME" >> "$GITHUB_ENV"

      - name: Generate the release notes
        run: |
          set -uo pipefail
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}HEAD"
          echo "range: ${RANGE}"
          {
            echo "## Install it"
            echo
            echo "Download the \`.apk\` below on an Android phone and open it."
            echo "Allow installation from this source when prompted — it is signed"
            echo "with the Android debug key, not a Play Store key."
            echo
            echo "## What changed"
            echo
            git log --no-merges --format='- %s' "$RANGE" 2>/dev/null || echo "- initial build"
            echo
            echo "## Artifact"
            echo
            echo '```'
            cat "${ASSET}.sha256"
            echo '```'
            echo
            echo "Built by [run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from \`${GITHUB_SHA}\`."
            echo "The JS bundle is embedded, so it runs with no dev server (#46),"
            echo "and the emulator smoke test passed on this exact artifact."
            echo
            echo "## Sign-offs"
            echo
            echo "- [ ] **Test** — Tuesday training."
            echo "- [ ] **Prod** — Saturday match. Outcome appended here afterwards."
          } > notes.md
          cat notes.md

      - name: Publish the release
        run: |
          set -uo pipefail
          # --target creates the tag at this commit, which is the whole point:
          # nothing outside CI has to be able to push a tag.
          if gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              $PRERELEASE \
              "$ASSET" "$ASSET.sha256" 2>/tmp/gh-err.txt; then
            echo "release created"
          else
            echo "--- gh release create failed; stderr follows ---"
            cat /tmp/gh-err.txt
            # A re-run of the same build should update, not fail.
            echo "attempting to update an existing release of the same tag"
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber || exit 1
          fi

          URL="$(gh release view "$TAG" --json url --jq .url)"
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          IS_PRE="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
          echo "release: $URL  draft=$IS_DRAFT prerelease=$IS_PRE"
          gh release view "$TAG" --json assets --jq '.assets[] | "asset: \(.name)"'

          {
            echo "### Release \`$TAG\`"
            echo
            echo "**[Open the release]($URL)** — draft=\`$IS_DRAFT\` prerelease=\`$IS_PRE\`"
            echo
            gh release view "$TAG" --json assets --jq '.assets[] | "- \(.name)"'
          } >> "$GITHUB_STEP_SUMMARY"
