name: App Store media

# #108 E, PO ruling "approve 1 2 3", then "approve 1" (2026-10-06): the App
# Store screenshots, made in CI from the `store` build (ADR-017 amendment,
# 2026-10-06). That build is Heart FC Coach, exactly what App Review sees, but
# on an empty simulator it opens with the Test kit's made-up squad and season
# (first names only, invariant 4) and shows no Test kit. It is built here
# only, for the simulator only, and never uploaded: TestFlight and every
# release assert distribution:app in the bundle. The preview video was
# dropped by that second ruling; check_store_media.py still checks one.
#
# Maestro (pinned, checksummed) taps through store/app-store/maestro/
# screenshots.yaml on an iPhone 6.9" and an iPad 13" simulator. #226: shot 3,
# the plan picture, is copied from the app's container (Maestro cannot reach
# the iOS share sheet) and put on a black screen. composite_shots.py (Pillow,
# pinned with hashes) then frames and captions every raw shot to Dee's design,
# with the captions in store/app-store/en-GB/screenshot_captions.txt, at
# Apple's exact sizes, RGB with no alpha. The framed shots are checked
# against Apple's rules and the approved set (check_store_media.py), kept as
# this run's `store-media` artifact and pushed to store-media-preview. Once
# Rob approves them they are committed under store/app-store/screenshots/,
# which is what the release run uploads (asc_api.py release --screenshots).
#
#   gh workflow run store-media.yml --ref main
#   gh workflow run store-media.yml --ref <pr-branch>   # the shots for a PR, before merge

# By hand only (PO, 2026-10-06: "you're burning credits"). A run is about an
# hour of macOS minutes, so it never starts on a push or a pull request.
on:
  workflow_dispatch:

concurrency:
  group: store-media-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.11.0
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  BUNDLE_ID: com.vanstoner.coachingapp
  # Milliseconds: the XCTest driver's first start on a fresh simulator.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'

jobs:
  media:
    name: Screenshots
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write             # only to push the store-media-preview branch
    env:
      # Heart FC Coach's identity; the distribution is what makes it seed.
      APP_VARIANT: ''
      DISTRIBUTION: store
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Before the hour of Mac time: a broken compositor or a caption that
      # runs to three lines fails here, in a minute.
      - name: Install Pillow (pinned, hashed) and self-test the compositor and the media checks
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r .github/scripts/requirements-media.txt
          python3 .github/scripts/check_store_media.py --self-test
          python3 .github/scripts/composite_shots.py --self-test
          python3 .github/scripts/composite_shots.py check-captions store/app-store/en-GB/screenshot_captions.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # The label shows on Home, and a store screenshot must not read
      # "(pr ?)" on a PR run (GitHub ignores an override of the event name).
      - name: Compute the version
        run: |
          set -euo pipefail
          .github/scripts/build-label.sh | sed 's/^\(BUILD_LABEL=.*\) (pr [^)]*)$/\1/' >> "$GITHUB_ENV"
          grep '^BUILD_LABEL=' "$GITHUB_ENV"

      - name: Write the build label and the store distribution into the bundle
        run: |
          set -euo pipefail
          python3 .github/scripts/write-distribution.py --self-test
          python3 .github/scripts/write-build-label.py "$BUILD_LABEL"
          python3 .github/scripts/write-distribution.py "$DISTRIBUTION" "$APP_VARIANT"
          grep -qF "'distribution:store'" src/app/generated-distribution.ts \
            || { echo "WHY THIS JOB FAILED: the generated module does not say distribution:store"; exit 1; }

      # The newest runtime and the biggest display of each family Apple asks
      # for, picked from what this image has rather than hardcoded. Before the
      # build, so the simulators finish booting while it runs.
      - name: Create the iPhone 6.9" and iPad 13" simulators
        run: |
          set -euo pipefail
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          rs=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"]]
          print(sorted(rs,key=lambda r:[int(x) for x in r["version"].split(".")])[-1]["identifier"])')"
          pick() { xcrun simctl list devicetypes -j | python3 -c '
          import json,re,sys
          names=[d["name"] for d in json.load(sys.stdin)["devicetypes"]]
          # The newest model: the highest number in the name, not the last
          # in the Xcode list (run 2 got an iPhone 11 Pro Max, 1242x2688).
          def key(n):
              return [int(x) for x in re.findall(r"\d+", n)]
          hits=sorted((n for n in names if re.search(sys.argv[1], n)), key=key)
          print(hits[-1] if hits else "")' "$1"; }
          IPHONE="$(pick '^iPhone \d+ Pro Max$')"
          IPAD="$(pick '^iPad Pro 13-inch')"
          [ -n "$IPHONE" ] && [ -n "$IPAD" ] || { echo "WHY THIS JOB FAILED: no iPhone Pro Max or iPad Pro 13-inch device type"; xcrun simctl list devicetypes; exit 1; }
          echo "runtime $RUNTIME; iphone '$IPHONE'; ipad '$IPAD'"
          IPHONE_UDID="$(xcrun simctl create store-iphone "$IPHONE" "$RUNTIME")"
          IPAD_UDID="$(xcrun simctl create store-ipad "$IPAD" "$RUNTIME")"
          # Boot both now: a new simulator's first boot spent nine minutes in
          # data migration on this image, so it runs during the build.
          xcrun simctl boot "$IPHONE_UDID"
          xcrun simctl boot "$IPAD_UDID"
          echo "IPHONE_UDID=$IPHONE_UDID" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$IPAD_UDID" >> "$GITHUB_ENV"

      - name: Generate the native iOS project
        env:
          APP_VERSION_NAME: ${{ env.VERSION }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build for the simulator, signing off
        run: |
          set -euo pipefail
          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          [ "${#workspaces[@]}" -eq 1 ] || { echo "WHY THIS JOB FAILED: expected one .xcworkspace, found ${#workspaces[@]}"; exit 1; }
          SCHEME="$(basename "${workspaces[0]}" .xcworkspace)"
          if ! xcodebuild -workspace "${workspaces[0]}" -scheme "$SCHEME" -configuration Release \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > /tmp/xcodebuild.log 2>&1; then
            tail -n 200 /tmp/xcodebuild.log
            echo "WHY THIS JOB FAILED: xcodebuild did not compile the store build"
            grep -E 'error:' /tmp/xcodebuild.log | sed -n '1,25p' || true
            exit 1
          fi
          APP="build/Build/Products/Release-iphonesimulator/$SCHEME.app"
          python3 .github/scripts/write-distribution.py --assert-bundle "$APP/main.jsbundle" store \
            || { echo "WHY THIS JOB FAILED: the .app's bundle is not only distribution:store"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  /tmp/maestro.zip" | shasum -a 256 -c -
          unzip -q /tmp/maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Screenshots on the iPhone, then the iPad
        run: |
          set -uo pipefail
          FLOWS="$GITHUB_WORKSPACE/store/app-store/maestro"
          fail=0
          prepare() {  # UDID
            xcrun simctl boot "$1" 2>/dev/null || true
            xcrun simctl bootstatus "$1" -b
            xcrun simctl status_bar "$1" override --time 9:41 --dataNetwork wifi --wifiMode active \
              --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl install "$1" "$APP"
          }
          CAPTIONS="$GITHUB_WORKSPACE/store/app-store/en-GB/screenshot_captions.txt"
          COMPOSITE="$GITHUB_WORKSPACE/.github/scripts/composite_shots.py"
          shots() {  # UDID display
            mkdir -p "media/maestro-$2" "media/debug-$2" "media/raw-$2"
            touch "$RUNNER_TEMP/flow-start-$2"
            # DEVICE picks the flow's taps by position (a card's top line, the
            # share sheet's "2 x 2", a swipe outside the pitch), which differ
            # between the 440x956 iPhone and the 1032x1376 iPad.
            ( cd "media/maestro-$2" && maestro --device "$1" test -e "DEVICE=$2" \
                --test-output-dir "$GITHUB_WORKSPACE/media/debug-$2" \
                "$FLOWS/screenshots.yaml" ) || { echo "MEDIA PROBLEM: the $2 screenshot flow failed"; fail=1; }
            # Maestro writes takeScreenshot to the working directory or the
            # output directory, by version: the NN-name.png files, from either.
            find "media/maestro-$2" "media/debug-$2" -name '[0-9][0-9]-*.png' -exec cp {} "media/raw-$2/" \;
            # Shot 3: the flow ends with the share sheet up, so the 2 x 2 plan
            # picture the app captured is still in its tmp folder. Newest PNG
            # written during this flow; on black, at this device's raw size.
            container="$(xcrun simctl get_app_container "$1" "$BUNDLE_ID" data 2>/dev/null || true)"
            picture=""
            if [ -n "$container" ] && [ -d "$container/tmp" ]; then
              picture="$(find "$container/tmp" -name '*.png' -newer "$RUNNER_TEMP/flow-start-$2" -print0 \
                | xargs -0 ls -t 2>/dev/null | head -n 1 || true)"
            fi
            size="$(python3 -c 'import sys; from PIL import Image; print(*Image.open(sys.argv[1]).size)' \
              "media/raw-$2/01-alert.png" 2>/dev/null || true)"
            if [ -n "$picture" ] && [ -n "$size" ]; then
              # shellcheck disable=SC2086 # "W H", two arguments
              python3 "$COMPOSITE" on-black "$picture" "media/raw-$2/03-plan.png" $size || fail=1
            else
              echo "MEDIA PROBLEM: no plan picture in the $2 app container's tmp/ (or no 01-alert to size it by)"
              fail=1
            fi
            python3 "$COMPOSITE" compose "media/raw-$2" "media/$2" "$2" "$CAPTIONS" || fail=1
            python3 .github/scripts/check_store_media.py shots "media/$2" "$2" || fail=1
          }
          # One simulator at a time, each retried once from a fresh boot.
          # Both booted during the build (the first boot is the slow one), but
          # running them together hung a tap for five minutes (run 9) and a
          # launch for eight (run 2).
          device() {  # UDID display
            local saved=$fail
            fail=0
            prepare "$1"
            shots "$1" "$2"
            if [ "$fail" != 0 ]; then
              echo "the $2 flow failed once; retrying from a fresh boot"
              fail=0
              # Keep the failed attempt's Maestro screenshots: run 41031067106
              # lost the only evidence of the iPad's first failure.
              if [ -d "media/debug-$2" ]; then rm -rf "media/debug-$2-attempt1"; mv "media/debug-$2" "media/debug-$2-attempt1"; fi
              rm -rf "media/$2" "media/raw-$2" "media/maestro-$2"
              xcrun simctl shutdown "$1" || true
              prepare "$1"
              shots "$1" "$2"
            fi
            xcrun simctl shutdown "$1" || true
            # An if, not `[ ] && ...`: under GitHub's bash -e a false test as
            # the function's last line ended the whole step before the iPad
            # and the WHY block (dry run, #226).
            if [ "$fail" = 0 ]; then fail=$saved; fi
          }
          xcrun simctl shutdown "$IPAD_UDID" || true
          device "$IPHONE_UDID" iphone
          device "$IPAD_UDID" ipad
          # Both displays hold exactly the captioned set, ready to commit.
          python3 .github/scripts/check_store_media.py set media "$CAPTIONS" || fail=1
          if [ "$fail" != 0 ]; then
            echo "=============================================================="
            echo "WHY THIS JOB FAILED: a flow failed or the media is outside Apple's rules;"
            echo "the MEDIA PROBLEM lines above say which. Maestro's own screenshots of"
            echo "the failing step are in the store-media artifact under debug-*."
            echo "=============================================================="
          fi
          exit $fail

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: store-media
          path: media/
          if-no-files-found: warn
          retention-days: 30

      # The artifact cannot be opened from Claude's cloud session, which
      # reviews these images before Rob sees them; a branch can. Made-up first
      # names only (invariant 4), nothing from a device. Replaced on each run.
      - name: Publish the media to the store-media-preview branch for review
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -d media ] || { echo "no media to publish"; exit 0; }
          D="$RUNNER_TEMP/preview-branch"
          rm -rf "$D" && mkdir -p "$D"
          rsync -a --include='*/' --include='*.png' --include='*.mp4' --include='*.json' --exclude='*' media/ "$D/"
          cd "$D"
          git init -q -b store-media-preview
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q --allow-empty -m "App Store media from run $GITHUB_RUN_ID ($GITHUB_SHA)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/store-media-preview
          echo "media on branch store-media-preview:"; git ls-files | head -60
