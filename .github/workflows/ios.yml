name: iOS

# #107 AC3 — every change proves the app still compiles for iPhone. Separate
# from android-apk.yml on purpose: different runner, different toolchain, and
# a red iOS build must not be confused with a red APK.
#
# What this job proves: the native iOS project Expo generates from app.json +
# app.config.js compiles, links and bundles the JS (Release embeds the bundle,
# as Android's assembleRelease does — #46), and the built .app carries the
# ruled bundle id (main vs beta) and ADR-011's backup exclusion key.
#
# What it does NOT prove: that the app launches or renders on a simulator, or
# anything about signing, provisioning or TestFlight. Signing is off because
# there is no Apple Developer enrolment yet; delivery is a separate issue.
#
# #128 AC5: the built .app is zipped and attached to the matching release
# (Coaching App on main, Coaching Beta on a PR) by the `attach` job, so it can
# be run in the iPhone simulator on a Mac (README, "Run it on a Mac").

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-build:
    name: Compile for the iOS simulator (signing off)
    # Pinned, not macos-latest: the -latest label migrates between images
    # over weeks and would change Xcode under us without a commit. macos-26 is
    # arm64 with Xcode 26 and CocoaPods preinstalled (actions/runner-images
    # README, read 2026-10-04). ExpoModulesCore needs Swift 6 (Xcode 16+).
    runs-on: macos-26
    timeout-minutes: 75
    env:
      # #79/#107: a PR build is Coaching Beta (com.vanstoner.coachingapp.beta);
      # main is Coaching App (com.vanstoner.coachingapp). Job level, so the
      # prebuild and the assertion agree.
      APP_VARIANT: ${{ github.event_name == 'pull_request' && 'beta' || '' }}
      # CFBundleVersion — this workflow's run number, read by app.config.js.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      # The build label says "(pr N)" on a PR build, which is what shows the
      # Test kit in Coaching Beta (#95). Without it the label read "(pr ?)".
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # Self-test BEFORE anything expensive: the assertion that runs at the
      # end is dry-run against both healthy cases (main and beta) and the
      # failing ones first. A gate nobody has run on good input is not a gate.
      - name: Self-test the .app assertion
        run: python3 .github/scripts/check_ios_app.py --self-test

      - name: Install dependencies
        run: npm ci

      # Same computation as the Android job, so CFBundleShortVersionString is
      # the build commit's date, never app.json's stale value.
      - name: Compute the version
        run: .github/scripts/build-label.sh >> "$GITHUB_ENV"

      # Same as the Android job (#52): the label is baked into the bundle, so
      # the beta knows it is the beta. Proved after the build, in the .app.
      - name: Write the build label into the bundle
        run: |
          set -euo pipefail
          python3 .github/scripts/write-build-label.py "$BUILD_LABEL"
          grep -qF "$BUILD_LABEL" src/app/generated-build-label.ts \
            || { echo "WHY THIS JOB FAILED: the generated module does not contain the label"; exit 1; }

      - name: Toolchain
        run: |
          xcodebuild -version
          pod --version
          node --version

      # ios/ is never committed (.gitignore): generated here from app.json, so
      # app.json stays the single source of truth for Info.plist.
      - name: Generate the native iOS project
        env:
          APP_VERSION_NAME: ${{ env.VERSION }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      # Names are DERIVED from what prebuild generated, never hardcoded: the
      # project is named after the display name (CoachingApp on main,
      # CoachingBeta on a PR — seen in a local prebuild, 2026-10-04).
      - name: Build for the simulator, signing off
        run: |
          set -euo pipefail
          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          if [ "${#workspaces[@]}" -ne 1 ]; then
            echo "WHY THIS JOB FAILED: expected exactly one .xcworkspace in ios/ after pod install, found ${#workspaces[@]}: ${workspaces[*]:-none}"
            ls -la ios
            exit 1
          fi
          WORKSPACE="${workspaces[0]}"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          if [ ! -f "ios/$SCHEME.xcodeproj/xcshareddata/xcschemes/$SCHEME.xcscheme" ]; then
            echo "WHY THIS JOB FAILED: no shared scheme named '$SCHEME' — prebuild's naming has changed"
            ls ios/*.xcodeproj/xcshareddata/xcschemes || true
            exit 1
          fi
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          # Full log to a file; xcodebuild's output is tens of thousands of
          # lines and the error that matters is never in the last forty.
          if ! xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              build > /tmp/xcodebuild.log 2>&1; then
            echo "::group::last 200 lines of xcodebuild"
            tail -n 200 /tmp/xcodebuild.log
            echo "::endgroup::"
            echo "=============================================================="
            echo "WHY THIS JOB FAILED: xcodebuild did not compile the app"
            echo "=============================================================="
            echo "--- first errors ---"
            grep -E '(error:|\*\* BUILD FAILED)' /tmp/xcodebuild.log | sed -n '1,25p' || true
            echo "=============================================================="
            exit 1
          fi
          grep -E '\*\* BUILD SUCCEEDED' /tmp/xcodebuild.log

      - name: Assert the .app's identity, version and backup exclusion
        run: |
          set -uo pipefail
          fail=0
          note() { echo "ASSERTION FAILED: $*"; fail=1; why="${why:-}$*"$'\n'; }
          APP="build/Build/Products/Release-iphonesimulator/$SCHEME.app"
          if [ ! -d "$APP" ]; then
            echo "WHY THIS JOB FAILED: no .app at $APP. Products found:"
            ls build/Build/Products/*/ || true
            exit 1
          fi
          echo "app: $APP ($(du -sh "$APP" | cut -f1))"

          echo "::group::#107 — bundle id, name, build number and ADR-011 key"
          # To a file, then printed: the specific ASSERTION lines are repeated
          # in the WHY block so the last forty lines say exactly what was wrong.
          # `|| check=$?`, not a bare call then `$?`: Actions runs this under
          # `bash -e`, which would end the step before the WHY block printed.
          check=0
          python3 .github/scripts/check_ios_app.py "$APP/Info.plist" "$APP_VARIANT" "$IOS_BUILD_NUMBER" \
            > /tmp/ios-check.txt 2>&1 || check=$?
          cat /tmp/ios-check.txt
          if [ "$check" != "0" ]; then
            note "the .app is not the app this build should produce (APP_VARIANT='$APP_VARIANT'):"
            why="${why}$(grep -E '^ASSERTION FAILED' /tmp/ios-check.txt | sed 's/^/  /')"$'\n'
          fi
          echo "::endgroup::"

          echo "::group::#46 — the JS bundle is embedded (Release)"
          if [ -s "$APP/main.jsbundle" ]; then
            echo "main.jsbundle: $(wc -c < "$APP/main.jsbundle" | tr -d ' ') bytes"
            # The label in the bundle is what tells the app it is the beta
            # (#95): checked in both encodings Hermes may use (#52).
            python3 .github/scripts/assert_label_in_bundle.py "$APP/main.jsbundle" "$BUILD_LABEL" \
              || note "the build label '$BUILD_LABEL' is not in the .app's bundle"
          else
            note "no main.jsbundle in the .app — it could not run without a Metro server"
          fi
          echo "::endgroup::"

          if [ "$fail" != "0" ]; then
            echo "=============================================================="
            echo "WHY THIS JOB FAILED"
            echo "=============================================================="
            printf '%s' "$why"
            echo "=============================================================="
          fi
          exit $fail

      # #128 AC5: the simulator build Rob can run on a Mac. ditto, not zip:
      # it keeps the .app bundle's symlinks and attributes intact, and Finder
      # unzips it with a double-click. The .app holds no squad data — the app
      # ships with a placeholder squad and real data lives only on a phone
      # (ADR-011) — so it is safe on a public release.
      - name: Zip the simulator .app
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphonesimulator/$SCHEME.app"
          if [ "$APP_VARIANT" = "beta" ]; then
            ZIP="coaching-beta-ios-simulator_pr-${PR_NUMBER}_${SHA:0:7}.zip"
          else
            ZIP="coaching-app-ios-simulator_${VERSION}_${SHA:0:7}.zip"
          fi
          mkdir -p sim-zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" "sim-zip/$ZIP"
          # It must unpack to exactly <Scheme>.app, which is what the README
          # tells Rob to install.
          if ! unzip -Z1 "sim-zip/$ZIP" | grep -qx "$SCHEME.app/Info.plist"; then
            echo "WHY THIS JOB FAILED: $ZIP does not unpack to $SCHEME.app"
            exit 1
          fi
          echo "zip: $ZIP ($(du -h "sim-zip/$ZIP" | cut -f1)), unpacks to $SCHEME.app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-simulator-app
          path: sim-zip/*.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Attach the simulator zip to the release or the beta — #128 AC5
  # ---------------------------------------------------------------------------
  #
  # This workflow and android-apk.yml run independently, and only the Android
  # one publishes releases (it owns the APK, the smoke test and the gates). So
  # THIS job waits for the release to exist and then uploads to it, rather than
  # the Android release job waiting on an iOS build that takes longer and may
  # never come: a slow or red Mac build must never hold up an APK.
  #
  # Which release: the one whose target commit is this build's commit. On
  # main, a full `v*` release at github.sha; on a PR, `beta` at the PR's head
  # sha (the beta job creates it with --target HEAD_SHA). Matched by commit,
  # because the tag's build number is Android's run number, not this one.
  #
  # Uploaded by release ID, not tag: if a newer PR replaces `beta` between the
  # lookup and the upload, the upload fails instead of landing on someone
  # else's beta. On a Linux runner, because waiting on macOS is billed at the
  # Mac rate. Bounded at 60 minutes, then a readable failure; the zip stays
  # downloadable as this run's `ios-simulator-app` artifact.
  attach:
    name: Attach the simulator build to the release
    needs: simulator-build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write             # least privilege: this job only
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      KIND: ${{ github.event_name == 'pull_request' && 'beta' || 'main' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-simulator-app
          path: sim-zip

      - name: Wait for the release, then attach
        run: |
          set -uo pipefail
          ZIP="$(find sim-zip -name '*.zip' -print -quit)"
          test -n "$ZIP" || { echo "WHY THIS JOB FAILED: no zip in the artifact"; exit 1; }
          NAME="$(basename "$ZIP")"
          if [ "$KIND" = "beta" ]; then
            FILTER='[.[] | select(.tag_name == "beta" and .target_commitish == $sha)][0].id // empty'
          else
            FILTER='[.[] | select((.tag_name | startswith("v")) and .target_commitish == $sha and (.prerelease | not))][0].id // empty'
          fi
          ID=""
          for i in $(seq 1 120); do
            ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" 2>/dev/null \
                  | jq -r --arg sha "$SHA" "$FILTER" 2>/dev/null)" || ID=""
            [ -n "$ID" ] && break
            echo "attempt $i: no $KIND release at ${SHA:0:7} yet; waiting 30s"
            sleep 30
          done
          if [ -z "$ID" ]; then
            echo "=============================================================="
            echo "WHY THIS JOB FAILED: no $KIND release for ${SHA:0:7} appeared within 60 minutes."
            echo "android-apk.yml publishes it; check whether its release or beta job ran."
            echo "The simulator zip is still on this run as the 'ios-simulator-app' artifact."
            echo "=============================================================="
            exit 1
          fi
          echo "release id $ID"

          # A re-run replaces its own earlier upload of the same name.
          OLD="$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" \
                 --jq ".[] | select(.name == \"$NAME\") | .id")" || OLD=""
          if [ -n "$OLD" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD" && echo "replaced earlier $NAME"
          fi

          if ! curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/zip" \
              --data-binary @"$ZIP" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$NAME" \
              > /tmp/upload.json 2>/tmp/upload-err.txt; then
            echo "=============================================================="
            echo "WHY THIS JOB FAILED: uploading $NAME to release $ID was refused"
            cat /tmp/upload-err.txt /tmp/upload.json 2>/dev/null
            echo "=============================================================="
            exit 1
          fi

          # Read back: the zip is on the release this build belongs to, and
          # that release still carries exactly one APK.
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > /tmp/release.json || exit 1
          TAG="$(jq -r .tag_name /tmp/release.json)"
          TARGET="$(jq -r .target_commitish /tmp/release.json)"
          APKS="$(jq '[.assets[].name | select(endswith(".apk"))] | length' /tmp/release.json)"
          HAS="$(jq --arg n "$NAME" '[.assets[].name | select(. == $n)] | length' /tmp/release.json)"
          jq -r '.assets[].name' /tmp/release.json | sed 's/^/  asset: /'
          echo "release $TAG target=${TARGET:0:7} apks=$APKS zip attached=$HAS"
          if [ "$TARGET" != "$SHA" ] || [ "$HAS" != "1" ] || [ "$APKS" != "1" ]; then
            echo "WHY THIS JOB FAILED: after upload, $TAG has target=$TARGET (want $SHA), zip=$HAS (want 1), apks=$APKS (want 1)"
            exit 1
          fi
          URL="$(jq -r .html_url /tmp/release.json)"
          {
            echo "### iPhone simulator build"
            echo
            echo "\`$NAME\` attached to **[$TAG]($URL)**."
          } >> "$GITHUB_STEP_SUMMARY"
