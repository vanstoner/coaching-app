name: App Store listing

# #108 D3: the listing text in store/app-store/en-GB goes to App Store Connect
# through the API, with the same key as TestFlight, in the same `app-store`
# environment, so Rob approves every run. Then it is read back and compared.
# By hand only, from main:
#
#   gh workflow run store-listing.yml --ref main                  # update
#   gh workflow run store-listing.yml --ref main -f dry_run=true  # differences only
#
# The files are checked against Apple's limits on every PR (ci.yml,
# check_listing.py), so a run here never meets a listing Apple would refuse.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would change; change nothing"
        type: boolean
        default: false

concurrency:
  group: store-listing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  listing:
    name: Update the App Store listing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store
    steps:
      - name: Refuse anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "WHY THIS JOB FAILED: the listing goes from main only; this run is on $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the listing files against Apple's limits
        run: |
          python3 .github/scripts/check_listing.py --self-test
          python3 .github/scripts/check_listing.py store/app-store/en-GB

      - name: Write and check the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          .github/scripts/asc-key.sh "$RUNNER_TEMP/asc-key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"

      - name: Upload the listing and read it back
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          echo "version page: $VERSION"
          if [ "$DRY_RUN" = true ]; then
            python3 .github/scripts/asc_api.py listing com.vanstoner.coachingapp "$VERSION" store/app-store/en-GB --dry-run
          else
            python3 .github/scripts/asc_api.py listing com.vanstoner.coachingapp "$VERSION" store/app-store/en-GB
          fi

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"
