# App Store screenshots for 1.3.0: Dee's eight shots (#226, PO "approve
# 1234"). Run by store-media.yml on an iPhone 6.9" and an iPad 13"
# simulator against the `store` build. On an empty store it seeds made-up
# names only (invariant 4) and every state the shots need (demoSeed.ts,
# Ellis, 99594b8). Each clearState re-seeds with a fresh start time. Each
# takeScreenshot is NN-name.png, named as in
# store/app-store/en-GB/screenshot_captions.txt. composite_shots.py frames
# and captions each one, and the file-name order is the store order.
#
# Captured in the order the seed allows, not in the store order:
#   launch 1   01-alert (retried from a fresh seed if it reads late), then
#              05-squad, 02-fairness, 06-child, 04-report, 07-five, then
#              Forget everything and seven names for 08-start
#   launch 2   03-plan, LAST. The flow ends with the share sheet up, so the
#              PNG the app captured is still in its container's tmp/;
#              store-media.yml copies it out (Maestro cannot reach the iOS
#              share sheet, run 9). The app deletes that PNG when the plan
#              screen closes, so nothing may follow it.
#
# Every on-screen text the flow matches is in `env` below, in one place,
# because #228 may change labels. Maestro matches a pressable by its whole
# accessible text (a regex), so a player's row is "Dee,.*". Every value was
# checked against the source after #228's tidy-up (ccbbb48): none changed.
# The clock's new strip and "Next: …" line are not matched; the prompt panel
# and its "in 0:14" countdown are as before, and the full-time award card
# cannot show mid-Q1.
#
# Run 40001608860 (dc88887) taught two things, from its screen hierarchies:
# - Never scroll the clock or a plan by Maestro's default swipe. It starts
#   at the screen's centre, which on the iPhone is the striker's pill
#   (Gus, [165,457][278,503] of 440x956). The pill's PanResponder takes the
#   gesture and the screen never scrolls ("Vertical scroll bar, 2 pages",
#   0%, after 20 swipes). So the clock is left by relaunching, and the plan
#   is scrolled by a swipe down its edge, outside the pitch.
# - A relaunch without clearState may open on Resume or straight on Home
#   (the iPad opened on Home). The flow handles both (`to Home` below).
#
# A fixture card is one accessible element ("Mock Albion, Sat 24 Oct ·
# 10:00, 50 min · Quarters, Edit the plan, Remove"). Its links are not
# separate elements, and a tap lands on the card's centre, which is the
# "Edit the plan" / "Plan this match" link (card 174 pt: 12 padding, 61 of
# text, then the 44 pt link at 73-117). That is right for 03-plan. For
# 07-five the card's top must be tapped. Taps by position depend on the
# display, so store-media.yml passes DEVICE (iphone or ipad).
appId: com.vanstoner.coachingapp
env:
  # Resume screen (ResumeScreen.tsx)
  BACK_TO_MATCH: "Back to the match"
  RESUME_TO_HOME: "Not now.*go to Home"
  # Either screen a launch can open on: Home (its Squad tab) or Resume
  HOME_OR_RESUME: "Squad|Not now.*go to Home"
  # Shot 1: the amber prompt, still counting down ("in 0:14", not "late 0:02")
  SUB_PROMPT: "Bring on Hal for:"
  COUNTING_DOWN: "in 0:[0-9]{2}"
  # Tabs
  TAB_HOME: "Home"
  TAB_SQUAD: "Squad"
  TAB_SETTINGS: "Settings"
  # Squad views
  FAIRNESS_TILE: "Fairness.*"
  BACK_TO_SQUAD: "Back to Squad"
  CHILD_ROW: "Dee,.*"
  BACK_FROM_CHILD: "Back to.*"
  # Home's fixtures: a played match, the 5-a-side card, the planned match
  PLAYED_MATCH: ".*Trial Town.*"
  FIVE_A_SIDE_CARD: "Practice Park, .*Plan this match.*"
  PLANNED_CARD: "Mock Albion, .*Edit the plan.*"
  # The line-up (LineupScreen.tsx) and the plan (PlanScreen.tsx)
  LINEUP: "On the pitch"
  PLAN_STARTING: "Starting"
  SHARE_PLAN: "Share plan"
  # Settings › Forget everything, confirmed inline
  FORGET: "Forget everything"
  FORGET_YES: "Yes, forget everything"
  # Squad: the name field and its button; Home's card after one step
  NAME_FIELD: "First name"
  ADD_NAME: "Add"
  GETTING_STARTED: "Getting started.*"
---
# --- launch 1 ---------------------------------------------------------------
# 01-alert. The seed makes Hal's sub fall due 14 s after it runs
# (STORE_SUB_DUE_AFTER_LAUNCH_MS), so the prompt is amber from launch. A cold
# first launch can take longer than that (run 40001608860: late on the first
# attempt on both devices, amber "in 0:10" and "in 0:11" on the second), so
# it starts again from a fresh seed.
- retry:
    maxRetries: 3
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: ${BACK_TO_MATCH}
          timeout: 60000
      - tapOn: ${BACK_TO_MATCH}
      - extendedWaitUntil:
          visible: ${SUB_PROMPT}
          timeout: 10000
      - assertVisible: ${COUNTING_DOWN}
      - takeScreenshot: 01-alert

# To Home: relaunch, keeping state. On Resume, take "Not now — go to Home".
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ${HOME_OR_RESUME}
    timeout: 30000
- runFlow:
    when:
      visible: ${RESUME_TO_HOME}
    commands:
      - tapOn: ${RESUME_TO_HOME}
- extendedWaitUntil:
    visible: ${TAB_SQUAD}
    timeout: 20000

# 05-squad, 02-fairness, 06-child: the made-up season (all three taken on
# the iPad in run 40001608860).
- tapOn: ${TAB_SQUAD}
- waitForAnimationToEnd
- takeScreenshot: 05-squad
- tapOn: ${FAIRNESS_TILE}
- waitForAnimationToEnd
- takeScreenshot: 02-fairness
- scrollUntilVisible:
    element: ${BACK_TO_SQUAD}
- tapOn: ${BACK_TO_SQUAD}
- scrollUntilVisible:
    element: ${CHILD_ROW}
- tapOn: ${CHILD_ROW}
- waitForAnimationToEnd
- takeScreenshot: 06-child
- scrollUntilVisible:
    element: ${BACK_FROM_CHILD}
- tapOn: ${BACK_FROM_CHILD}

# 04-report: Trial Town, under Played (taken on the iPad in that run).
- tapOn: ${TAB_HOME}
- scrollUntilVisible:
    element: ${PLAYED_MATCH}
- tapOn: ${PLAYED_MATCH}
- waitForAnimationToEnd
- takeScreenshot: 04-report

# 07-five: the Practice Park card under Coming up opens the 1-2-1 + GK
# line-up. A relaunch puts Home back at the top, where the card's top sits
# at a known point; its centre would be "Plan this match".
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ${HOME_OR_RESUME}
    timeout: 30000
- runFlow:
    when:
      visible: ${RESUME_TO_HOME}
    commands:
      - tapOn: ${RESUME_TO_HOME}
- extendedWaitUntil:
    visible: ${FIVE_A_SIDE_CARD}
    timeout: 20000
# The card's top lines, per display (logical 440x956 and 1032x1376). iPad:
# the card is [234,613][798,787] in run 40001608860, so 46% is 633, 20 pt in.
# iPhone, worked out from that: the clock strip starts 30 pt lower than on the
# iPad (76 against 46 in the same run), and the made-up-team line keeps its
# 44 pt height on two lines, so the card is about [643,817]. 71% is 679,
# 36 pt in. The "Plan this match" link starts 73 pt in.
- runFlow:
    when:
      true: ${DEVICE == "ipad"}
    commands:
      - tapOn:
          point: "50%,46%"
- runFlow:
    when:
      true: ${DEVICE != "ipad"}
    commands:
      - tapOn:
          point: "50%,71%"
- extendedWaitUntil:
    visible: ${LINEUP}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 07-five

# 08-start: forget everything, add seven made-up first names, then Home
# shows the one-line Getting started with step 1 done.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: ${HOME_OR_RESUME}
    timeout: 30000
- runFlow:
    when:
      visible: ${RESUME_TO_HOME}
    commands:
      - tapOn: ${RESUME_TO_HOME}
- extendedWaitUntil:
    visible: ${TAB_SETTINGS}
    timeout: 20000
- tapOn: ${TAB_SETTINGS}
- scrollUntilVisible:
    element: ${FORGET}
- tapOn: ${FORGET}
- tapOn: ${FORGET_YES}
- extendedWaitUntil:
    visible: ${TAB_SQUAD}
    timeout: 20000
- tapOn: ${TAB_SQUAD}
- tapOn: ${NAME_FIELD}
- inputText: "Abi"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Bram"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Cleo"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Dax"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Elsie"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Fen"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Gwen"
- tapOn: ${ADD_NAME}
# The keyboard covers the tab bar on a phone: a tap on "Home" would land on
# a key. Put it away first.
- hideKeyboard
- tapOn: ${TAB_HOME}
- extendedWaitUntil:
    visible: ${GETTING_STARTED}
    timeout: 10000
# Option A (Claude, under Rob's approved shot set): open the strip so the
# shot shows the three steps its caption names. The steps are in an
# ActionSheet (a Modal), which Maestro can screenshot but not wait on, so
# the wait is on the animation, not on its text.
- tapOn: ${GETTING_STARTED}
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-start

# --- launch 2: 03-plan, last --------------------------------------------------
# A fresh seed (the forgotten season is back). Home, then the Mock Albion
# card: its centre is "Edit the plan" (only Mock Albion has a plan). Share
# plan is below the plan's pitches, reached by swiping down the screen's edge,
# never from the centre, where a pill would take the gesture.
# The share choice ("2 × 2, best on a phone") is in an ActionSheet, a Modal
# whose buttons Maestro cannot find on iOS (run 9), so it is tapped at
# a point worked out from Sheet.tsx and each device's bottom inset.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ${HOME_OR_RESUME}
    timeout: 60000
- runFlow:
    when:
      visible: ${RESUME_TO_HOME}
    commands:
      - tapOn: ${RESUME_TO_HOME}
- extendedWaitUntil:
    visible: ${PLANNED_CARD}
    timeout: 20000
- tapOn: ${PLANNED_CARD}
- extendedWaitUntil:
    visible: ${PLAN_STARTING}
    timeout: 10000
- repeat:
    times: 8
    while:
      notVisible: ${SHARE_PLAN}
    commands:
      # x outside the pitch, inside the scroll view: iPad 22% (227 of
      # [216,234]), iPhone 2% (9 of [0,18]). Whole percents only.
      - runFlow:
          when:
            true: ${DEVICE == "ipad"}
          commands:
            - swipe:
                start: 22%,80%
                end: 22%,35%
                duration: 700
      - runFlow:
          when:
            true: ${DEVICE != "ipad"}
          commands:
            - swipe:
                start: 2%,80%
                end: 2%,35%
                duration: 700
- tapOn: ${SHARE_PLAN}
- waitForAnimationToEnd:
    timeout: 3000
# "2 x 2": iPad 1164-1216 of 1376 (86% is 1183), iPhone 730-782 of 956
# (79% is 755), from Sheet.tsx over a 20 or 34 pt bottom inset.
- runFlow:
    when:
      true: ${DEVICE == "ipad"}
    commands:
      - tapOn:
          point: "50%,86%"
- runFlow:
    when:
      true: ${DEVICE != "ipad"}
    commands:
      - tapOn:
          point: "50%,79%"
# The share sheet is up once the PNG is written; give it a moment.
- extendedWaitUntil:
    visible: "__never__"
    timeout: 5000
    optional: true
