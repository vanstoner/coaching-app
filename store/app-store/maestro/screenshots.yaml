# App Store screenshots for 1.3.0: Dee's eight shots (#226, PO "approve
# 1234"). Run by store-media.yml on an iPhone 6.9" and an iPad 13"
# simulator against the `store` build. On an empty store it seeds made-up
# names only (invariant 4) and every state the shots need (demoSeed.ts,
# Ellis, 99594b8). Each clearState re-seeds with a fresh start time. Each
# takeScreenshot is NN-name.png, named as in
# store/app-store/en-GB/screenshot_captions.txt. composite_shots.py frames
# and captions each one, and the file-name order is the store order.
#
# Captured in the order the seed allows, not in the store order:
#   launch 1   01-alert (retried from a fresh seed if it reads late), then
#              05-squad, 02-fairness, 06-child, 04-report, 07-five, then
#              Forget everything and seven names for 08-start
#   launch 2   03-plan, LAST. The flow ends with the share sheet up, so the
#              PNG the app captured is still in its container's tmp/;
#              store-media.yml copies it out (Maestro cannot reach the iOS
#              share sheet, run 9). The app deletes that PNG when the plan
#              screen closes, so nothing may follow it.
#
# Every on-screen text the flow matches is in `env` below, in one place,
# because #228 may change labels. Maestro matches a pressable by its whole
# accessible text (a regex), so a player's row is "Dee,.*". This flow has not
# been run on a simulator yet.
appId: com.vanstoner.coachingapp
env:
  # Resume screen, and leaving the clock (ResumeScreen.tsx, ClockScreen.tsx)
  BACK_TO_MATCH: "Back to the match"
  LEAVE_CLOCK: "Leave — the match keeps running"
  # Shot 1: the amber prompt, still counting down ("in 0:14", not "late 0:02")
  SUB_PROMPT: "Bring on Hal for:"
  COUNTING_DOWN: "in 0:[0-9]{2}"
  # Tabs
  TAB_HOME: "Home"
  TAB_SQUAD: "Squad"
  TAB_SETTINGS: "Settings"
  # Squad views
  FAIRNESS_TILE: "Fairness.*"
  BACK_TO_SQUAD: "Back to Squad"
  CHILD_ROW: "Dee,.*"
  BACK_FROM_CHILD: "Back to.*"
  # Home's fixtures: a played match, the 5-a-side card, the planned match
  PLAYED_MATCH: ".*Trial Town.*"
  FIVE_A_SIDE_CARD: ".*Practice Park.*"
  EDIT_PLAN: "Edit the plan"
  SHARE_PLAN: "Share plan"
  # Settings › Forget everything, confirmed inline
  FORGET: "Forget everything"
  FORGET_YES: "Yes, forget everything"
  # Squad: the name field and its button; Home's card after one step
  NAME_FIELD: "First name"
  ADD_NAME: "Add"
  GETTING_STARTED: "Getting started.*"
---
# --- launch 1 ---------------------------------------------------------------
# 01-alert. The seed makes Hal's sub fall due 14 s after it runs
# (STORE_SUB_DUE_AFTER_LAUNCH_MS), so the prompt is amber from launch. If a
# slow start lets it turn late, start again from a fresh seed.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: ${BACK_TO_MATCH}
          timeout: 60000
      - tapOn: ${BACK_TO_MATCH}
      - extendedWaitUntil:
          visible: ${SUB_PROMPT}
          timeout: 10000
      - assertVisible: ${COUNTING_DOWN}
      - takeScreenshot: 01-alert
- scrollUntilVisible:
    element: ${LEAVE_CLOCK}
- tapOn: ${LEAVE_CLOCK}
- extendedWaitUntil:
    visible: ${TAB_SQUAD}
    timeout: 20000

# 05-squad, 02-fairness, 06-child: the made-up season, as before.
- tapOn: ${TAB_SQUAD}
- waitForAnimationToEnd
- takeScreenshot: 05-squad
- tapOn: ${FAIRNESS_TILE}
- waitForAnimationToEnd
- takeScreenshot: 02-fairness
- scrollUntilVisible:
    element: ${BACK_TO_SQUAD}
- tapOn: ${BACK_TO_SQUAD}
- scrollUntilVisible:
    element: ${CHILD_ROW}
- tapOn: ${CHILD_ROW}
- waitForAnimationToEnd
- takeScreenshot: 06-child
- scrollUntilVisible:
    element: ${BACK_FROM_CHILD}
- tapOn: ${BACK_FROM_CHILD}

# 04-report: Trial Town, under Played.
- tapOn: ${TAB_HOME}
- scrollUntilVisible:
    element: ${PLAYED_MATCH}
- tapOn: ${PLAYED_MATCH}
- waitForAnimationToEnd
- takeScreenshot: 04-report

# 07-five: the Practice Park card under Coming up opens the 1-2-1 + GK
# line-up. index 0: a played Practice Park also shows, under Played, below.
# Home is reached again by relaunching (state kept): Resume, then Leave.
- launchApp:
    stopApp: true
- tapOn: ${BACK_TO_MATCH}
- scrollUntilVisible:
    element: ${LEAVE_CLOCK}
- tapOn: ${LEAVE_CLOCK}
- tapOn:
    text: ${FIVE_A_SIDE_CARD}
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 07-five

# 08-start: forget everything, add seven made-up first names, then Home
# shows Getting started with step 1 ticked.
- launchApp:
    stopApp: true
- tapOn: ${BACK_TO_MATCH}
- scrollUntilVisible:
    element: ${LEAVE_CLOCK}
- tapOn: ${LEAVE_CLOCK}
- tapOn: ${TAB_SETTINGS}
- scrollUntilVisible:
    element: ${FORGET}
- tapOn: ${FORGET}
- tapOn: ${FORGET_YES}
- tapOn: ${TAB_SQUAD}
- tapOn: ${NAME_FIELD}
- inputText: "Abi"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Bram"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Cleo"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Dax"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Elsie"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Fen"
- tapOn: ${ADD_NAME}
- tapOn: ${NAME_FIELD}
- inputText: "Gwen"
- tapOn: ${ADD_NAME}
- tapOn: ${TAB_HOME}
- extendedWaitUntil:
    visible: ${GETTING_STARTED}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 08-start

# --- launch 2: 03-plan, last --------------------------------------------------
# A fresh seed (the forgotten season is back). Home › Edit the plan (only
# Mock Albion has one) › Share plan › "2 × 2, best on a phone". That choice
# is in an ActionSheet, a Modal whose buttons Maestro cannot find on iOS
# (run 9), so it is tapped by position: the sheet's first, highlighted
# button. UNTESTED on both simulators; if it misses, the run says "no plan
# picture" and debug-*/ shows where the sheet sits.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ${BACK_TO_MATCH}
    timeout: 60000
- tapOn: ${BACK_TO_MATCH}
- scrollUntilVisible:
    element: ${LEAVE_CLOCK}
- tapOn: ${LEAVE_CLOCK}
- scrollUntilVisible:
    element: ${EDIT_PLAN}
- tapOn: ${EDIT_PLAN}
- waitForAnimationToEnd
- scrollUntilVisible:
    element: ${SHARE_PLAN}
- tapOn: ${SHARE_PLAN}
- waitForAnimationToEnd
- tapOn:
    point: "50%,82%"
# The share sheet is up once the PNG is written; give it a moment.
- extendedWaitUntil:
    visible: "__never__"
    timeout: 5000
    optional: true
