# The App Store preview video — #108 E, storyboard on #108: Home, Play now,
# the lineup, the clock running, the Squad's fair shares, one child's page.
# store-media.yml records the screen around this flow and trims it to
# 15–30 seconds. The `__never__` waits are pauses: nothing has that text.
appId: com.vanstoner.coachingapp
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Squad"
    timeout: 60000
- waitForAnimationToEnd
- extendedWaitUntil: { visible: "__never__", timeout: 2500, optional: true }

- tapOn: "Play now"
- tapOn:
    text: "Use suggestion"
    optional: true
- extendedWaitUntil: { visible: "__never__", timeout: 2000, optional: true }

- tapOn: "Start .*"
- extendedWaitUntil: { visible: "__never__", timeout: 5000, optional: true }

- scrollUntilVisible:
    element: "Leave.*"
- tapOn: "Leave.*"
- tapOn: "Squad"
- extendedWaitUntil: { visible: "__never__", timeout: 2000, optional: true }
- tapOn: "Fairness.*"
- extendedWaitUntil: { visible: "__never__", timeout: 3000, optional: true }
- scrollUntilVisible:
    element: "Back to Squad"
- tapOn: "Back to Squad"
- scrollUntilVisible:
    element: "Dee,.*"
- tapOn: "Dee,.*"
- extendedWaitUntil: { visible: "__never__", timeout: 3500, optional: true }
